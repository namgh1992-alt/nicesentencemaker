<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교생활기록부 문장 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 한글·엑셀 파일을 만들 때만 쓰는 라이브러리입니다. 같은 폴더에 함께 두어
     인터넷이 끊긴 교실에서도 동작합니다. (JSZip 3.10.1 MIT, SheetJS 0.18.5 Apache-2.0) -->
<script src="vendor/jszip.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#dfe4ec;
  --panel:#ffffff;
  --panel-2:#f2f5f9;
  --head:#eaeef4;
  --line:#c9d1dd;
  --line-soft:#e2e7ef;
  --ink:#1f2937;
  --ink-2:#5b6676;
  --ink-3:#8a94a3;
  --blue:#1a62b3;
  --blue-d:#14508f;
  --blue-l:#e9f1fb;
  --blue-t:#1d5fa8;
  --btn:#ffffff;
  --btn-line:#b9c2d0;
  --ok:#137a50;
  --warn:#b4451a;
  --sel:#e7f0fc;
  --shadow:0 2px 10px rgba(22,38,64,.16);
  --radius:3px;
}
:root:not([data-theme="light"]){
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b212b;
    --panel:#232a35;
    --panel-2:#1f2630;
    --head:#2a3240;
    --line:#3a4454;
    --line-soft:#333c4a;
    --ink:#e6eaf1;
    --ink-2:#aab4c3;
    --ink-3:#7e8899;
    --blue:#3f86d8;
    --blue-d:#356fb4;
    --blue-l:#243447;
    --blue-t:#7db4ee;
    --btn:#2b3340;
    --btn-line:#485262;
    --sel:#28394f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b212b;--panel:#232a35;--panel-2:#1f2630;--head:#2a3240;--line:#3a4454;--line-soft:#333c4a;
  --ink:#e6eaf1;--ink-2:#aab4c3;--ink-3:#7e8899;--blue:#3f86d8;--blue-d:#356fb4;--blue-l:#243447;
  --blue-t:#7db4ee;--btn:#2b3340;--btn-line:#485262;--sel:#28394f;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans KR","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.55;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

/* ---------- 나이스 스타일 공통 ---------- */
.win{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);}
.win-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--head);border-bottom:1px solid var(--line);
  padding:7px 10px;font-weight:700;font-size:12.5px;color:var(--ink);
}
.win-bar .x{margin-left:auto;border:0;background:none;color:var(--ink-2);font-size:15px;line-height:1;padding:2px 4px}
.sec-title{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700;padding:12px 4px 10px;}
.sec-title::before{content:"";width:4px;height:15px;background:var(--blue);display:inline-block;border-radius:1px}
.sub-title{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;margin:0 0 7px}
.sub-title::before{content:"";width:3px;height:12px;background:var(--blue);display:inline-block}

.fbox{background:var(--panel-2);border:1px solid var(--line);padding:11px 12px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.f{display:flex;align-items:center;gap:7px}
.f > label{color:var(--ink-2);min-width:52px;font-weight:500}
input[type=text],input[type=number],select,textarea{
  background:var(--panel);border:1px solid var(--btn-line);border-radius:2px;padding:4px 7px;min-width:0;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{width:100%;resize:vertical;line-height:1.6}

.btn{border:1px solid var(--btn-line);background:var(--btn);border-radius:var(--radius);padding:4px 11px;color:var(--ink);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--head)}
.btn.pri{background:var(--blue);border-color:var(--blue-d);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.lg{padding:7px 20px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent}

table.grid{width:100%;border-collapse:collapse;border-top:2px solid var(--blue-d);}
table.grid th{background:var(--head);border:1px solid var(--line-soft);border-top:0;padding:6px 8px;font-weight:700;color:var(--ink);white-space:nowrap}
table.grid td{border:1px solid var(--line-soft);padding:5px 8px;background:var(--panel);vertical-align:middle}
table.grid tr:hover td{background:var(--sel)}
.hint{color:var(--blue-t);font-size:12px;margin:8px 2px}
.muted{color:var(--ink-3)}
.scroll{overflow:auto}
.hidden{display:none !important}

/* ---------- 레이아웃 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:16px 14px 60px}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:0 1px 6px rgba(20,35,60,.10)
}
.topbar-in{max-width:1180px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.brand::before{content:"";width:4px;height:16px;background:var(--blue)}
.brand-sub{color:var(--ink-2);font-weight:400;font-size:12.5px}
.topbar .spacer{flex:1}

.tabs{display:flex;gap:0;margin:14px 0 0}
.tab{
  border:1px solid var(--line);border-bottom:0;background:var(--panel-2);color:var(--ink-2);
  padding:8px 26px;font-weight:700;border-radius:4px 4px 0 0;margin-right:3px
}
.tab[aria-selected="true"]{background:var(--panel);color:var(--blue-t);border-top:2px solid var(--blue);padding-top:7px}
.tabpanel{border:1px solid var(--line);background:var(--panel);padding:14px}

.toolrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}

/* 학생 카드 */
.stu{border:1px solid var(--line);margin-bottom:8px;background:var(--panel)}
.stu-h{display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--head);cursor:pointer;border-bottom:1px solid var(--line)}
.stu-h .no{background:var(--blue);color:#fff;border-radius:2px;padding:1px 9px;font-weight:700;min-width:34px;text-align:center}
.d-del{background:#fde3dd;color:#8a2b0c;text-decoration:line-through;border-radius:2px;padding:0 1px}
.d-ins{background:#d9f2e3;color:#0d5c3c;border-radius:2px;padding:0 1px;font-weight:700}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .d-del{background:#4a2019;color:#ffb4a0}
  :root:not([data-theme="light"]) .d-ins{background:#133a2a;color:#7ee0b0}
}
:root[data-theme="dark"] .d-del{background:#4a2019;color:#ffb4a0}
:root[data-theme="dark"] .d-ins{background:#133a2a;color:#7ee0b0}
.fld.row-on{border-left:3px solid var(--blue)}
.fld.row-off{opacity:.5}
.fld.row-off:hover,.fld.row-off:focus-within{opacity:1}
.numbadge{background:var(--blue);color:#fff;border-radius:2px;padding:1px 9px;font-weight:700;min-width:36px;text-align:center;display:inline-block}
.stu-h .st{font-size:12px;color:var(--ink-2)}
.stu-h .arr{margin-left:auto;color:var(--ink-2);transition:transform .15s}
.stu[data-open="1"] .stu-h .arr{transform:rotate(180deg)}
.stu-b{padding:10px}
.stu[data-open="0"] .stu-b{display:none}

.fld{border:1px solid var(--line-soft);margin-bottom:9px}
.fld-h{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--panel-2);border-bottom:1px solid var(--line-soft);font-weight:700;font-size:12.5px}
.fld-h .cnt{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.fld-h .over{color:var(--warn);font-weight:700}
.fld-b{padding:8px 9px}
.out{
  white-space:pre-wrap;word-break:break-word;min-height:22px;cursor:text;
  border:1px dashed transparent;border-radius:2px;padding:3px 4px;
}
.out:hover{border-color:var(--line)}
.out.empty{color:var(--ink-3);font-style:normal}
.out-edit{width:100%;min-height:96px;border:1px solid var(--blue);padding:6px;border-radius:2px;background:var(--panel)}
.savetag{font-size:11.5px;color:var(--ok);margin-left:6px}

/* 코드 버튼 */
.cat{border:1px solid var(--line-soft);margin-bottom:9px}
.cat-h{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--panel-2);border-bottom:1px solid var(--line-soft);font-weight:700}
.cat-h .code{color:var(--blue-t);font-size:11.5px;font-weight:500}
.cat-h .tools{margin-left:auto;display:flex;gap:4px}
.cat-b{padding:9px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  border:1px solid var(--btn-line);background:var(--btn);border-radius:12px;padding:3px 11px;font-size:12.3px;
  display:inline-flex;align-items:center;gap:5px
}
.chip:hover{background:var(--head)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue-d);color:#fff}
.chip .del{opacity:.5;font-size:11px}
.chip .del:hover{opacity:1}
.obs{margin-top:8px}
.obs label{display:block;color:var(--ink-2);margin-bottom:3px;font-size:12px}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:26px 12px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.modal-b{padding:14px;max-height:none}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:rgba(20,35,60,.92);color:#fff;padding:7px 16px;border-radius:3px;font-size:12.5px;box-shadow:var(--shadow)}

/* 진행바 */
.prog{height:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);width:0%;transition:width .25s}

/* 로그인 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 14px}
.login{width:100%;max-width:470px}
.login .win-bar{font-size:13px}
.login-b{padding:20px 22px 22px}
.login .row{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.login .row label{width:78px;color:var(--ink-2);font-weight:500}
.login .row input,.login .row select{flex:1}
.copyright{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;color:var(--ink-3);font-size:12px}
.copyright img{display:block;opacity:.92}
.recent{margin-top:14px;border-top:1px dashed var(--line);padding-top:11px}
.rec-row{display:flex;gap:0;margin-bottom:5px}
.rec-open{flex:1;text-align:left;border:1px solid var(--line-soft);border-right:0;background:var(--panel-2);padding:6px 9px;border-radius:2px 0 0 2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-open:hover{background:var(--sel)}
.rec-del{border:1px solid var(--line-soft);background:var(--panel-2);color:var(--ink-3);padding:0 11px;border-radius:0 2px 2px 0;font-size:12px}
.rec-del:hover{background:#b4451a;border-color:#b4451a;color:#fff}

@media (max-width:640px){
  .wrap{padding:12px 9px 50px}
  .tab{padding:8px 16px}
  .login .row{flex-wrap:wrap}
  .login .row label{width:100%}
  table.grid{font-size:12px}
}
.tablewrap{overflow-x:auto}

/* 규칙 엔진 점검 표시 */
.rchk{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;font-size:11.5px;margin-top:4px;padding:4px 8px;border-left:3px solid var(--line)}
.rchk b{flex:0 0 auto;font-size:11px;padding:0 5px;border-radius:2px;color:#fff}
.rchk .muted{font-size:11px}
.rchk.blk{background:#fdeceb;border-left-color:#b4291a}.rchk.blk b{background:#b4291a}
.rchk.fix{background:#fdf4e6;border-left-color:#B5812A}.rchk.fix b{background:#B5812A}
.rchk.warn{background:#fff9e3;border-left-color:#8a6d13}.rchk.warn b{background:#8a6d13}
.rchk.note{background:var(--panel-2);border-left-color:var(--line);color:var(--ink-2);font-size:11px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rchk.blk{background:#3a211e}
 :root:not([data-theme="light"]) .rchk.fix{background:#352c1c}
 :root:not([data-theme="light"]) .rchk.warn{background:#322e1a}}
.hint{color:var(--blue-t,#1d5fa8);font-size:12px;margin:7px 2px;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modalRoot"></div>
<script>
/* ============================================================
   1. 기본 데이터 (갈래 / 과목 / 창체 활동)
   ============================================================ */
const SUBJECTS_ALL = ["국어","수학","사회","영어","과학","체육","음악","미술","실과","도덕","학교자율시간","바른 생활","슬기로운 생활","즐거운 생활"];

/* ============================================================
   1-R. 규칙 기반 문장 자산  (AI를 쓰지 않습니다)
   · *_TAXONOMY_DEFAULT : 선택 화면에 보이는 갈래와 항목 이름
   · keys               : 항목마다 붙은 고정 키. 문장을 찾는 열쇠다.
                          교사가 항목을 지우거나 더해도 어긋나지 않는다.
                          직접 더한 항목의 키는 null 이고, 문장 자산이 없다.
   · SENT               : 키 → 문장 변형 목록
   ============================================================ */
const BEHAV_TAXONOMY_DEFAULT = [
  {id:"A", name:"성격·기질", items:["신중·관찰형","활발·주도형","온화·수용형","독립·몰입형","유연·적응형","차분·안정형","호기심·탐구형","낙천·유머형","섬세·감수성형","꾸준·반복형"], keys:["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10"]},
  {id:"B", name:"학습 태도", items:["과제 완수","질문으로 확인","오답 점검","집중 유지","교과별 흥미 편차","자료 준비","기록·메모","설명 역할","정확을 택함","시도를 택함"], keys:["B1","B2","B3","B4","B5","B6","B7","B8","B9","B10"]},
  {id:"C", name:"책임과 역할", items:["맡은 일 완수","궂은일 자원","역할 분담 조정","시간 약속","점검·확인","뒤처리 마무리","빈자리 대신 맡음","기록·보고","규칙 안내","이끄는 역할"], keys:["C1","C2","C3","C4","C5","C6","C7","C8","C9","C10"]},
  {id:"D", name:"또래 관계", items:["두루 어울림","깊이 사귐","다툼 중재","먼저 다가감","또래에게 배움","놀이 주도","차례 양보","약속 지킴","응원과 인정","무리 안 조율"], keys:["D1","D2","D3","D4","D5","D6","D7","D8","D9","D10"]},
  {id:"E", name:"의사소통·표현", items:["발표 태도","듣는 자세","글로 표현","그림·몸짓 표현","근거 들어 말함","질문 만들기","요약·전달","다른 의견 다루기","바른 말씨","매체 활용"], keys:["E1","E2","E3","E4","E5","E6","E7","E8","E9","E10"]},
  {id:"F", name:"정서·자기조절", items:["감정 알아차림","화를 다스림","좌절을 넘김","기다림","긴장 다루기","스스로 다독임","도움 청하기","충동 조절","변화 받아들임","남의 마음 헤아림"], keys:["F1","F2","F3","F4","F5","F6","F7","F8","F9","F10"]},
  {id:"G", name:"생활 습관·자기관리", items:["정리정돈","시간 관리","준비물 챙김","위생·건강","안전 지킴","스스로 챙김","물건 아낌","목표 세우기","되돌아보기","바른 자세·태도"], keys:["G1","G2","G3","G4","G5","G6","G7","G8","G9","G10"]},
  {id:"H", name:"문제 해결·사고", items:["방법 찾기","원인 짚기","견주어 보기","규칙 발견","계획 세우기","대안 떠올리기","자료 다루기","조건 따지기","만들어 내기","따져 받아들이기"], keys:["H1","H2","H3","H4","H5","H6","H7","H8","H9","H10"]},
  {id:"I", name:"배려·공동체", items:["도움 주기","공동 물건 아낌","규칙 지킴","다름 존중","학급 일 참여","환경 돌봄","나눔","약자 보호","공공 예절","함께 이룸"], keys:["I1","I2","I3","I4","I5","I6","I7","I8","I9","I10"]},
  {id:"J", name:"흥미·관심", items:["읽기·책","수·과학","예술·표현","역사·사회","만들기·도구","디지털·정보","자연·생명","말과 이야기","관심의 전이","꾸준한 몰입"], keys:["J1","J2","J3","J4","J5","J6","J7","J8","J9","J10"]},
  {id:"K", name:"신체·건강", items:["운동 참여","협동 경기","끈기 있게 몸 쓰기","몸 다루는 감각","건강 챙김","안전한 움직임","규칙 있는 경기 운영","야외 활동","리듬·표현 운동","몸의 성장 기록"], keys:["K1","K2","K3","K4","K5","K6","K7","K8","K9","K10"]},
  {id:"L", name:"변화와 성장", items:["말수가 늘어남","끝까지 해내게 됨","친구 관계가 넓어짐","감정 다루기가 늘어남","자신감이 붙음","집중 시간이 길어짐","생활 습관이 자리 잡음","협동이 늘어남","표현이 깊어짐","스스로 하는 힘이 늚"], keys:["L1","L2","L3","L4","L5","L6","L7","L8","L9","L10"]},

const LS = "neisgen_v1:";
let DB = null, DL = null;
let capReady = false;
let capPromise = null;
let capState = "loading";   // loading | ready | nosample

function hashKey(s){
  let h1=0x811c9dc5, h2=0x01000193;
  for(let i=0;i<s.length;i++){
    h1 = (h1 ^ s.charCodeAt(i)) >>> 0; h1 = Math.imul(h1, 16777619) >>> 0;
    h2 = (h2 + s.charCodeAt(i)*(i+7)) >>> 0;
  }
  return (h1.toString(36) + "" + h2.toString(36)).replace(/[^a-z0-9]/g,"").slice(0,24);
}
function sessKey(m){ return hashKey(m.year+"|"+m.school+"|"+m.grade+"|"+m.cls); }

function lsListSessions(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(LS)){
      try{ const v=JSON.parse(localStorage.getItem(k)); if(v&&v.meta) out.push(v); }catch(e){}
    }
  }
  out.sort((a,b)=>(b._ts||0)-(a._ts||0));
  return out;
}
function lsLoad(key){
  try{ const raw = localStorage.getItem(LS+key); return raw? JSON.parse(raw):null; }catch(e){ return null; }
}
function markSaved(){
  const t = document.getElementById("saveTag");
  if(!t) return;
  t.textContent = "저장됨";
  clearTimeout(t._t); t._t = setTimeout(()=>{ t.textContent=""; }, 1600);
}
function lsSave(st){
  st._ts = Date.now();
  setTimeout(markSaved, 0);
  try{ localStorage.setItem(LS+st.key, JSON.stringify(st)); }catch(e){ toast("브라우저 저장 공간이 부족합니다."); }
}
function clone(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }
let UID = null, TABID = Math.random().toString(36).slice(2,10);
let remoteWatch = null, pendingRemote = null;
function docPath(key){ return UID ? ("data/users/"+UID+"/"+key) : null; }

async function dbLoad(key){
  if(!DB || !UID) return null;
  try{
    const snap = await DB.doc(docPath(key)).get();
    if(!snap || !snap.exists) return null;
    const d = snap.data();
    return (d && d.payload) ? clone(d.payload) : null;
  }catch(e){ return null; }
}
let dbTimer=null, dbBusy=false, dbPending=false;
function dbSaveSoon(st){
  if(!DB || !UID) return;
  if(st && st.demo) return;          // 예시 학급은 계정에 올리지 않는다
  clearTimeout(dbTimer);
  dbTimer = setTimeout(()=>dbFlush(), 1200);
}
async function dbFlush(){
  if(!DB || !UID || !S || S.demo) return;
  if(dbBusy){ dbPending=true; return; }
  dbBusy = true;
  try{
    await DB.doc(docPath(S.key)).set({payload:S, ts:S._ts||Date.now(), tab:TABID});
  }catch(e){ /* 쓰기 권한이 없으면 이 브라우저 저장만 쓴다 */ }
  dbBusy = false;
  if(dbPending){ dbPending=false; setTimeout(dbFlush, 300); }
}
function watchRemote(){
  if(remoteWatch){ try{ remoteWatch(); }catch(e){} remoteWatch=null; }
  if(!DB || !UID || !S || S.demo) return;
  try{
    remoteWatch = DB.doc(docPath(S.key)).onSnapshot(snap=>{
      if(!snap || !snap.exists) return;
      const d = snap.data();
      if(!d || !d.payload || d.tab===TABID) return;
      if((d.ts||0) > (S._ts||0) + 2000) showConflict(clone(d.payload));
    }, ()=>{});
  }catch(e){}
}
function closeAllModals(){ const r=document.getElementById("modalRoot"); if(r) r.innerHTML=""; }
function showConflict(payload){
  pendingRemote = payload;
  const old = document.getElementById("conflictBar"); if(old) old.remove();
  const bar = el("div",{id:"conflictBar",style:"position:fixed;left:0;right:0;bottom:0;z-index:90;background:#8a3b12;color:#fff;padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 -2px 10px rgba(0,0,0,.25)"},
    el("span",null,"다른 창이나 기기에서 이 학급을 더 최근에 저장했습니다. 한 곳에서만 작업하는 편이 안전합니다."),
    el("div",{style:"flex:1"}),
    el("button",{class:"btn sm",onClick:()=>{ closeAllModals(); S=ensureShape(clone(pendingRemote)); lsSave(S); bar.remove(); render(); toast("최신 내용을 불러왔습니다."); }},"최신 내용 불러오기"),
    el("button",{class:"btn sm",onClick:()=>bar.remove()},"이 창 유지"));
  document.body.append(bar);
}

   3. 상태
   ============================================================ */
let S = null;          // 현재 세션 상태
let SEM = 1;           // 현재 학기
let screen = "login";

function blankSemester(){
  return {
    behavior:{},      // {catId:{code:index, obs:"..."}}
    term:{},          // {catId:{code:index, obs:"..."}}
    extra:"",         // 추가 관찰
    cca:{auto:[],club:[],career:[],service:[]},  // [{n, obs, period}]
    split:{auto:{},club:{},career:{}},           // 누가기록 분할 {활동명: 문장}
    out:{behavior:"", term:{}, auto:"", club:"", career:"", service:""}
  };
}
function blankStudent(no){
  return {no:no, s1:blankSemester(), s2:blankSemester()};
}
function newSession(meta){
  return {
    key: sessKey(meta), meta: meta, _ts: Date.now(), seed: 0,
    count: 0, subjects: [],
    behavTax: JSON.parse(JSON.stringify(BEHAV_TAXONOMY_DEFAULT)),
    termTax: JSON.parse(JSON.stringify(TERM_TAXONOMY_DEFAULT)),
    ccaCat: JSON.parse(JSON.stringify(CCA_DEFAULT)),
    evals: {1:[], 2:[]},     // [{subject, std, content}]
    students: [],
    lead: false,             // 학년부장 여부
    recv: {1:{}, 2:{}},      // 과목별 마지막 수신 시각
    setupDone: false
  };
}
function sem(stu, n){ return n===1? stu.s1 : stu.s2; }
function inheritSem2(){
  if(!S) return;
  S.students.forEach(stu=>{
    const a=stu.s1, b=stu.s2;
    const emptyB = Object.keys(b.behavior||{}).length===0 && Object.keys(b.term||{}).length===0;
    const hasA = Object.keys(a.behavior||{}).length>0 || Object.keys(a.term||{}).length>0;
    if(emptyB && hasA){
      b.behavior = JSON.parse(JSON.stringify(a.behavior));
      b.term = JSON.parse(JSON.stringify(a.term));
      if(!(b.extra||"").trim()) b.extra = a.extra||"";
    }
  });
}

function ensureShape(st){
  if(st && Object.isFrozen(st)) st = clone(st);
  if(st && st.students && st.students.length && Object.isFrozen(st.students[0])) st = clone(st);
  st.evals = st.evals||{1:[],2:[]}; st.evals[1]=st.evals[1]||[]; st.evals[2]=st.evals[2]||[];
  st.seed = st.seed|0;
  /* 규칙 엔진 이전에 저장한 학급은 갈래에 키가 없다.
     키가 없으면 문장을 찾을 수 없으므로 갈래를 새로 깔고 선택만 비운다.
     이미 만들어 둔 문장은 그대로 남는다. */
  const needsMigrate = !st.behavTax || !st.behavTax.length || !st.behavTax[0].keys;
  if(needsMigrate){
    st.behavTax = JSON.parse(JSON.stringify(BEHAV_TAXONOMY_DEFAULT));
    st.termTax  = JSON.parse(JSON.stringify(TERM_TAXONOMY_DEFAULT));
    st.ccaCat   = JSON.parse(JSON.stringify(CCA_DEFAULT));

];

/* 예시 학급의 문장은 규칙 엔진이 그 자리에서 만듭니다.
   (전에 쓰던 고정 문장 더미는 지웠습니다) */
function buildDemo(){
  const meta = {school:"예시초등학교", grade:4, cls:1, year:new Date().getFullYear()};
  const st = newSession(meta);
  st.demo = true;
  st.subjects = DEMO_SUBJECTS.slice();
  st.evals = {1: DEMO_EVALS.map(e=>Object.assign({},e)), 2: []};
  st.setupDone = true;
  st.count = 24;
  st.students = [];

  const roles = {1:"학급회장", 2:"학급부회장", 3:"전교학생회장"};
  const clubs = ["독서","체육·운동","과학탐구"];

  for(let i=0;i<24;i++){
    const no = i+1;
    const stu = blankStudent(no);
    const sm = stu.s1;

    /* 행동특성 — 번호마다 다른 갈래 네 개 */
    const bcat = ["A","B","C","D","E","F","G","H","I","J","K","L"];
    for(let slot=0; slot<4; slot++){
      const c = bcat[(i*(slot*2+3) + slot*5) % bcat.length];
      if(!sm.behavior[c]) sm.behavior[c] = {i:(i*(slot+2)+slot*3) % 10, obs:""};
    }
    if(i===0) sm.behavior.A = {i:0, obs:"모둠 토의에서 친구들의 의견을 끝까지 들은 뒤 정리해 말함"};
    if(i===1) sm.behavior.C = {i:0, obs:"모둠 정리 당번이 빠진 날 대신 맡아 마무리함"};

    /* 학기말 — 갈래 세 개 (과목 공통) */
    const tcat = ["M","N","O","P","Q","R"];
    for(let slot=0; slot<3; slot++){
      const c = tcat[(i*(slot+2) + slot) % tcat.length];
      if(!sm.term[c]) sm.term[c] = {i:(i*(slot+3)) % 10, obs:""};
    }
    if(i===0) sm.extra = "2학기 들어 발표를 맡는 횟수가 늘고 모둠에서 기록을 자주 맡음";

    /* 창의적 체험활동 — 학급이 함께 한 활동 + 번호별 차이 */
    const auto = [{n:"학급회의", obs:"", period:""}];
    if(i<16) auto.push({n:"환경·기후 교육", obs:"", period:""});
    if(roles[no]) auto.unshift({n:roles[no], obs:"", period:"20"+String(meta.year).slice(2)+".03.02.~20"+String(meta.year).slice(2)+".08.31."});
    sm.cca.auto = auto.slice(0,3);
    sm.cca.club = [{n:clubs[i % 3], obs:"", period:""}];
    sm.cca.career = (i<20) ? [{n:"꿈 발표", obs:"", period:""}] : [{n:"진로 검사·상담", obs:"", period:""}];
    sm.cca.service = (i<12) ? [{n:"교내 환경 정화", obs:"", period:""}, {n:"또래 돕기", obs:"", period:""}]
                            : [{n:"교내 환경 정화", obs:"", period:""}];

    /* 23·24번은 일부를 비워 두어 ‘아직 생성되지 않았습니다’를 보여 준다 */
    if(no === 23){ sm.cca.career = []; sm.cca.service = []; }
    if(no === 24){ sm.behavior = {}; sm.term = {}; sm.cca.club = []; sm.cca.career = []; sm.cca.service = []; }

    st.students.push(stu);
  }
  inheritSem2Of(st);
  /* 문장은 규칙 엔진이 그 자리에서 만든다. 실제로 나오는 결과를 그대로 보여 주기 위해서다. */
  const keepS = S, keepSem = SEM;
  S = st; SEM = 1;
  try{
    for(let i=0;i<st.students.length;i++) ruleGenerate(i, 1);
    repairDiversity(1);
  } finally { S = keepS; SEM = keepSem; }
  st._ts = Date.now();
  return st;
}
function inheritSem2Of(st){
  st.students.forEach(stu=>{
    stu.s2.behavior = JSON.parse(JSON.stringify(stu.s1.behavior));
    stu.s2.term = JSON.parse(JSON.stringify(stu.s1.term));
    stu.s2.extra = stu.s1.extra;
  });
}

}

function catEditor(tax, store, onChange, opts){
  const box = el("div");
  tax.forEach((cat)=>{
    const c = el("div",{class:"cat"});
    const h = el("div",{class:"cat-h"}, cat.name, el("span",{class:"code"}, cat.id+"1~"+cat.id+cat.items.length));
    const tools = el("div",{class:"tools"});
    let editing=false;
    const bEdit = el("button",{class:"btn sm ghost"},"항목 편집");
    const bAdd  = el("button",{class:"btn sm"},"+ 항목 추가");
    tools.append(bEdit,bAdd); h.append(tools);
    const body = el("div",{class:"cat-b"});
    const chips = el("div",{class:"chips"});
    const obsWrap = el("div",{class:"obs"});

    function cur(){ return store[cat.id]||null; }
    function drawObs(){
      obsWrap.innerHTML="";
      const s = cur();
      if(!s){ return; }
      const lab = el("label",null,"관찰 장면 · "+cat.id+(s.i+1)+" "+cat.items[s.i]+"  (비워 두면 선택 항목만으로 문장을 만듭니다)");
      const ta = el("textarea",{rows:"2",placeholder:"예) 모둠 토의에서 친구들 의견을 끝까지 들은 뒤 정리해 말함"});
      ta.value = s.obs||"";
      let ck = obsCheckNode(s.obs, nv=>{ s.obs=nv; ta.value=nv; onChange&&onChange(); redraw(); });
      let tmr=null;
      function redraw(){ const n2=obsCheckNode(s.obs, nv=>{ s.obs=nv; ta.value=nv; onChange&&onChange(); redraw(); });
        ck.replaceWith(n2); ck=n2; }
      ta.addEventListener("input",()=>{ s.obs=ta.value; onChange&&onChange();
        clearTimeout(tmr); tmr=setTimeout(redraw, 600); });
      obsWrap.append(lab,ta,ck);
    }
    function drawChips(){
      chips.innerHTML="";
      cat.items.forEach((it,i)=>{
        const sel = cur() && cur().i===i;
        const chip = el("button",{class:"chip","aria-pressed":sel?"true":"false", onClick:async(e)=>{
          if(editing){
            const v = await askText("항목 수정", cat.name+" · "+cat.id+(i+1), it);
            if(v){ cat.items[i]=v; drawChips(); drawObs(); onChange&&onChange(); }
            return;
          }
          if(sel){ delete store[cat.id]; } else { store[cat.id]={i:i, obs:(cur()&&cur().obs)||""}; }
          drawChips(); drawObs(); onChange&&onChange();
        }}, el("span",{style:"opacity:.65;font-size:11px"},cat.id+(i+1)), it);
        if(editing){
          chip.append(el("span",{class:"del", onClick:async(e)=>{
            e.stopPropagation();
            if(!await confirmBox("항목 삭제","‘"+it+"’ 항목을 삭제합니다.")) return;
            cat.items.splice(i,1);
            if(cat.keys) cat.keys.splice(i,1);
            const s=cur(); if(s){ if(s.i===i) delete store[cat.id]; else if(s.i>i) s.i--; }
            drawChips(); drawObs(); onChange&&onChange();
          }},"✕"));
        }
        chips.append(chip);
      });
    }
    bEdit.addEventListener("click",()=>{ editing=!editing; bEdit.textContent = editing? "편집 끝내기":"항목 편집"; bEdit.classList.toggle("pri",editing); drawChips(); });
    bAdd.addEventListener("click",async()=>{
      const v = await askText("항목 추가", cat.name+"에 추가할 항목 이름", "");
      if(v){ cat.items.push(v); (cat.keys=cat.keys||[]).push(null); drawChips(); onChange&&onChange();
             toast("직접 더한 항목에는 문장 자산이 없습니다. 관찰 장면만 들어갑니다.", 4200); }
    });
    drawChips(); drawObs();
    body.append(chips, obsWrap);
    c.append(h, body); box.append(c);
  });
  return box;
}

function countDone(sm){
  let n=0,t=0;
  t++; if((sm.out.behavior||"").trim()) n++;

  return {n:n,t:t};
}

let SPELLBUSY = false, spellAbort = null;

/* 글자 단위 차이 계산 */
function diffOps(a, b){
  const n=a.length, m=b.length;
  if(n===0||m===0||n*m>360000) return [{t:"-",s:a},{t:"+",s:b}];
  const W=m+1, dp=new Uint16Array((n+1)*W);
  for(let i=n-1;i>=0;i--){
    for(let j=m-1;j>=0;j--){
      dp[i*W+j] = (a[i]===b[j]) ? dp[(i+1)*W+j+1]+1
                : (dp[(i+1)*W+j] >= dp[i*W+j+1] ? dp[(i+1)*W+j] : dp[i*W+j+1]);
    }
  }
  const ops=[]; let i=0,j=0;
  function push(t,ch){ const l=ops[ops.length-1]; if(l&&l.t===t) l.s+=ch; else ops.push({t:t,s:ch}); }
  while(i<n&&j<m){
    if(a[i]===b[j]){ push("=",a[i]); i++; j++; }
    else if(dp[(i+1)*W+j] >= dp[i*W+j+1]){ push("-",a[i]); i++; }
    else { push("+",b[j]); j++; }
  }
  while(i<n){ push("-",a[i]); i++; }
  while(j<m){ push("+",b[j]); j++; }
  return ops;
}
function simRatio(ops, a, b){
  let same=0; ops.forEach(o=>{ if(o.t==="=") same+=o.s.length; });
  return same / Math.max(a.length, b.length, 1);
}
/* 바뀐 곳만 표시 (앞뒤 맥락 조금) */
function diffNode(ops){
  const box = el("div",{style:"font-size:13px;line-height:1.8;word-break:break-word"});
  ops.forEach((o,idx)=>{
    if(o.t==="="){
      let t=o.s;
      if(t.length>34){
        const head = idx===0? "" : t.slice(0,16);
        const tail = idx===ops.length-1? "" : t.slice(-16);
        t = head + " … " + tail;
      }
      box.append(el("span",{class:"muted"}, t));
    } else if(o.t==="-"){
      box.append(el("span",{class:"d-del"}, o.s===" "? "␣" : o.s));
    } else {
      box.append(el("span",{class:"d-ins"}, o.s===" "? "␣" : o.s));
    }
  });
  return box;
}

function spellTargets(scope){
  const defs = itemDefs();
  const list = [];
  S.students.forEach(stu=>{
    const sm = sem(stu, SEM);
    defs.forEach(d=>{
      if(scope==="item" && d.key!==ITEMKEY) return;
      const v = (d.get(sm)||"").trim();
      if(v) list.push({no:stu.no, key:d.key, label:d.label, sm:sm, def:d, text:v});
    });
  });
  return list;
}

/* ============================================================
   9-C-R. 관찰 장면 점검 · 맞춤법 (규칙 기반, AI를 부르지 않습니다)
   규칙에 있는 것만 잡습니다. 없는 것은 그냥 지나갑니다.
   ============================================================ */
const BLOCK = [
 {re:/(?<![가-힣])(착하|착함)|성실하|성실함|훌륭|우수하|우수함|뛰어난|뛰어남|똑똑|영리|모범적|최고|완벽|대단하|멋진|예의 ?바/,
  why:"추상 평가어", fix:"그렇게 보인 장면을 적어 주세요. (예: 훌륭함 → 맡은 자리를 끝까지 지킴)"},
 {re:/(내성적|외향적|소극적|적극적인 ?성격|산만|이기적|게으르|게을|무기력|덜렁|소심|급한 ?성격)/,
  why:"성격을 단정함", fix:"성격으로 못박지 말고 그날 있었던 일로 바꿔 주세요."},
 {re:/(부족|못함|못하|안 ?됨|떨어짐|뒤처|미흡|서툴|실패)/,
  why:"약점을 결과로 적음", fix:"‘변화 과정’으로 바꿔 주세요. (예: 어려워하였음 → 몇 차례 다시 해 보며 방법을 찾아 감)"},
 {re:/(대회|경진|올림피아드|공모전|영재원|○○)/,
  why:"고유 정보", fix:"대회명·기관명은 기록부에 쓸 수 없습니다."},
 {re:/([가-힣]{1,6}(초등학교|중학교|고등학교)|[가-힣]{2,4}(시청|군청|교육청|문화원))/,
  why:"지역·기관 이름", fix:"지역명과 기관명은 빼 주세요."}
];
const FIX_SP = [
 [/되요/g,"돼요"],[/됬/g,"됐"],[/할께/g,"할게"],[/할꺼/g,"할 거"],[/몇일/g,"며칠"],
 [/역활/g,"역할"],[/바램/g,"바람"],[/금새/g,"금세"],[/오랫만/g,"오랜만"],[/어떻해/g,"어떡해"],
 [/설겆이/g,"설거지"],[/일일히/g,"일일이"],[/깨끗히/g,"깨끗이"],[/번번히/g,"번번이"],
 [/틈틈히/g,"틈틈이"],[/꼼꼼이/g,"꼼꼼히"],[/곰곰히/g,"곰곰이"],[/([가-힣])로써(?=\s|$|,)/g,"$1로서"]
];
/* 과거형 표지. 기록부 문장은 현재형으로 씁니다. 자동으로 바꾸지 않고 짚어만 줍니다. */
const PAST = [
  /[가-힣]*(었|았|였)(음|으나|으며|지만|고|기|던|다|어|을|는)/,
  /(했|됐|왔|갔|냈|섰|켰|쳤|졌|렸|겼|혔|꼈)(음|으나|지만|고|기|던|다|어|을|는|습)/
];
function finalOf(ch){ const c=ch.charCodeAt(0)-0xAC00; return (c<0||c>11171)?-1:c%28; }
function endOk(t){
  const s=String(t||"").trim().replace(/[.\s]+$/,"");
  if(!s) return true;
  const c=s.charCodeAt(s.length-1)-0xAC00, j=c%28;
  return c>=0 && c<=11171 && (j===16 || j===10);   /* ㅁ 또는 ㄻ (풂·삶·앎) */
}
function fixSpacing(t){
  let out=t, hits=[];
  const push=(a,b)=>{ if(out.indexOf(a)>=0){ out=out.split(a).join(b); hits.push(a+" → "+b); } };
  push("뿐만아니라","뿐만 아니라"); push("기때문","기 때문"); push("그외","그 외");
  const scan=(word,cond)=>{ let r="";
    for(let i=0;i<out.length;i++){ const ch=out[i], nx=out.slice(i+1,i+1+word.length);
      if(nx===word && cond(ch, out.slice(i+1+word.length))){ r+=ch+" "; hits.push(ch+word+" → "+ch+" "+word); }
      else r+=ch; } out=r; };
  scan("수",(c,rest)=>finalOf(c)===8 && /^\s*(있|없)/.test(rest));
  push("수있","수 있"); push("수없","수 없");
  scan("것",(c)=> finalOf(c)===8 || finalOf(c)===4 || c==="는");
  scan("때",(c,rest)=>finalOf(c)===8 && /^(에|는|가|부터|까지|마다|,|\.|\s|$)/.test(rest));
  return {out, hits};
}
const CHECK_COUNT = BLOCK.length + FIX_SP.length + 5 + PAST.length + 2;
function checkObs(raw){
  const t=String(raw||"").trim();
  const r={blocks:[],fixes:[],warns:[],fixed:t};
  if(!t) return r;
  BLOCK.forEach(b=>{ const m=t.match(b.re); if(m) r.blocks.push({w:m[0].trim(), why:b.why, fix:b.fix}); });
  let f=t;
  FIX_SP.forEach(([re,to])=>{ const b=f; f=f.replace(re,to); if(b!==f){ const m=b.match(re); if(m) r.fixes.push(m[0]+" → "+m[0].replace(re,to)); } });
  const sp=fixSpacing(f); f=sp.out; sp.hits.forEach(h=>r.fixes.push(h));
  r.fixed=f;
  if(!endOk(t)) r.warns.push("어미가 ~함 / ~임 / ~보임 이 아닙니다");
  const pm = t.match(PAST[0]) || t.match(PAST[1]);
  if(pm) r.warns.push("‘"+pm[0]+"’ — 과거형입니다. 현재형으로 적어 주세요 (예: 했음 → 함)");
  if(t.length>120) r.warns.push("관찰 장면이 "+t.length+"자입니다. 한 장면만 적는 편이 낫습니다");
  return r;
}
/* 관찰 장면 입력칸 아래에 붙이는 표시 */
function obsCheckNode(obs, applyFix){
  const box = el("div");

}

/* ---- 맞춤법 점검: 규칙으로 고친다 (AI 없음) ---- */
async function runSpell(scope, onProg){
  if(SPELLBUSY){ toast("이미 점검하고 있습니다."); return false; }
  const targets = spellTargets(scope);
  if(!targets.length){ toast("점검할 문장이 없습니다."); return false; }
  SPELLBUSY = true;
  const stamp = Date.now();
  let fixed=0, done=0;
  targets.forEach(t=>{
    let f = t.text, hits=[];
    FIX_SP.forEach(([re,to])=>{ const b=f; f=f.replace(re,to); if(b!==f){ const m=b.match(re); if(m) hits.push(m[0]); } });
    const sp = fixSpacing(f); f = sp.out;
    if(hits.length || sp.hits.length){
      const ops = diffOps(t.text, f);
      if(simRatio(ops, t.text, f) >= 0.82){
        t.def.set(t.sm, f);
        S.spellLog.unshift({sem:SEM, no:t.no, key:t.key, label:t.label, before:t.text, after:f, ts:stamp});
        fixed++;
      }
    }
    done++;
    onProg && onProg(done, targets.length, null);
  });
  if(S.spellLog.length>300) S.spellLog = S.spellLog.slice(0,300);
  SPELLBUSY=false;
  save(true);
  toast(fixed
    ? (fixed+"곳을 고쳤습니다. 규칙 "+CHECK_COUNT+"가지를 확인했습니다.")
    : ("규칙 "+CHECK_COUNT+"가지를 확인했습니다. 걸린 곳이 없습니다."), 4200);
  return true;
}

function revertSpell(e, quiet){
  const def = itemDefs().find(d=>d.key===e.key);
  const stu = S.students.find(x=>x.no===e.no);
  if(!def || !stu){ if(!quiet) toast("되돌릴 항목을 찾지 못했습니다."); return false; }
  const sm = sem(stu, e.sem);
  const now = (def.get(sm)||"").trim();
  if(now !== e.after.trim() && !quiet){
    toast("이 문장은 그 뒤에 다시 고쳐졌습니다. 되돌리지 않았습니다.", 3400);
    return false;
  }
  def.set(sm, e.before);
  return true;
}

function autoKindOf(key){

  return null;

let AUTOROUND = "";   // 누가기록에서 고른 활동(회차)

/* ---- 문장 나누기 ---- */
function splitSentences(t){
  const raw = String(t||"").replace(/\s+/g," ").trim();
  if(!raw) return [];
  const out=[]; let buf="";
  for(let i=0;i<raw.length;i++){
    buf += raw[i];
    if(raw[i]==="." && (i===raw.length-1 || raw[i+1]===" ")){ out.push(buf.trim()); buf=""; }
  }
  if(buf.trim()) out.push(buf.trim());
  return out;
}
function autoSplit(text, acts){
  const sents = splitSentences(text);
  const res = {}; acts.forEach(a=>{ res[a]=[]; });
  let last = acts[0] || null;
  sents.forEach(sn=>{
    let hit = null;
    acts.forEach(a=>{ if(!hit && sn.indexOf(a)>=0) hit=a; });
    if(!hit){
      const key = acts.find(a=>{
        const core = a.replace(/활동|교육|예방|관리/g,"");
        return core.length>=2 && sn.indexOf(core)>=0;
      });
      hit = key || last;
    }
    if(hit){ res[hit].push(sn); last = hit; }
  });
  const flat = {}; acts.forEach(a=>{ if(res[a].length) flat[a]=res[a].join(" "); });
  return flat;
}
function ensureSplit(stu, area, force){
  const sm = sem(stu, SEM);
  sm.split = sm.split||{}; sm.split[area] = sm.split[area]||{};
  const acts = stuActs(stu, area);
  const txt = (sm.out[area]||"").trim();
  const has = Object.keys(sm.split[area]).some(k=>(sm.split[area][k]||"").trim());
  if(force || (!has && txt && acts.length)) sm.split[area] = autoSplit(txt, acts);
  return sm.split[area];
}
function roundsOf(area){
  const names = [];
  S.students.forEach(stu=>{ stuActs(stu, area).forEach(n=>{ if(names.indexOf(n)<0) names.push(n); }); });
  const cat = (S.ccaCat[area]&&S.ccaCat[area].items)? S.ccaCat[area].items.map(i=>i.n):[];
  names.sort((a,b)=>{ const ia=cat.indexOf(a),ib=cat.indexOf(b); return (ia<0?999:ia)-(ib<0?999:ib); });
  return names;
}

/* ---- 보낼 자료 만들기 ---- */
function autoPayload(cur){
  const kind = autoKindOf(cur.key);
  const cfg = AUTO_CFG[kind];
  const cum = cfg && cfg.cum;
  const area = cum? kind : null;
  const rows = [];
  S.students.forEach(stu=>{
    const sm = sem(stu, SEM);
    let text = "";
    let why = "";
    if(cum){
      const acts = stuActs(stu, area);
      if(!AUTOROUND){ text = ""; why="회차 미선택"; }
      else if(acts.indexOf(AUTOROUND)<0){ text=""; why="이 활동 해당 없음"; }
      else {
        ensureSplit(stu, area);
        text = ((sm.split[area]||{})[AUTOROUND]||"").trim();
        if(!text) why="이 활동에 배정된 문장 없음";
      }
    } else {
      text = (cur.get(sm)||"").trim();
      if(!text) why="문장 없음";
    }
    rows.push({no:stu.no, text:text, why:why});
  });
  return rows;
}

/* 나이스 내려받기 파일을 그대로 흉내 낸다 :
   시트명 "자율활동관리 특기사항 " / 머리글 8칸 / 열 너비 / 특기사항 줄바꿈 서식까지 */
const XL_SHEET = "자율활동관리 특기사항 ";
const XL_COLS  = ["영역 구분","학년도","학년","반","번호","학생개인번호","성명","특기사항"];
const XL_GUBUN = "자율·자치활동_특기사항";
const XL_WIDTH = [17.140625, 14.28515625, 14.28515625, 14.28515625, 9.5703125, 14.28515625, 15.85546875, 34.85546875];

/* 한 학생의 특기사항 : 자율 + 엔터2 + 진로 + 엔터2 + (동아리명)동아리 */
function ccaMerged(stu){
  const sm = sem(stu, SEM);
  const parts = [];
  const a = (sm.out.auto||"").trim();   if(a) parts.push(a);
  const c = (sm.out.career||"").trim(); if(c) parts.push(c);
  const b = (sm.out.club||"").trim();
  if(b){
    const names = stuActs(stu, "club");
    parts.push((names.length? "("+names[0]+")" : "") + b);
  }
  return parts.join("\n\n");
}
function ccaXlRows(includeEmpty){
  const out = [];
  S.students.forEach(stu=>{
    const t = ccaMerged(stu);
    if(!t && !includeEmpty) return;
    out.push([XL_GUBUN, String(S.meta.year), String(S.meta.grade), String(S.meta.cls),
              String(stu.no), "", "", t]);
  });
  return out;
}

/* ---- xlsx 를 직접 조립해 원본 서식을 지킨다 ---- */
function xe2(v){
  return String(v==null?"":v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/\r\n/g,"\n").replace(/\r/g,"\n")
    .replace(/\n/g,"&#10;");
}
function colLetter(n){
  let s2=""; n++;
  while(n>0){ const m=(n-1)%26; s2=String.fromCharCode(65+m)+s2; n=Math.floor((n-1)/26); }
  return s2;
}
async function buildNeisXlsx(aoa){
  const zip = new JSZip();
  zip.file("[Content_Types].xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    +'<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
    +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    +'</Types>');
  zip.folder("_rels").file(".rels",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    +'</Relationships>');
  zip.folder("xl").file("workbook.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    +'<sheets><sheet name="'+xe2(XL_SHEET)+'" sheetId="1" r:id="rId1"/></sheets></workbook>');
  zip.folder("xl").folder("_rels").file("workbook.xml.rels",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
    +'<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    +'</Relationships>');
  /* 0 기본 / 1 머리글(회색) / 2 본문 가운데 / 3 특기사항(줄바꿈) */
  zip.folder("xl").file("styles.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>'
    +'<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
    +'<fill><patternFill patternType="solid"><fgColor rgb="00DDDDDD"/><bgColor indexed="64"/></patternFill></fill></fills>'
    +'<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
    +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    +'<cellXfs count="4">'
    +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    +'<xf numFmtId="0" fontId="0" fillId="2" borderId="0" xfId="0" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>'
    +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center"/></xf>'
    +'<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>'
    +'</cellXfs>'
    +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
    +'</styleSheet>');

  let cols = '<cols>';
  XL_WIDTH.forEach((w,i)=>{ cols += '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>'; });
  cols += '</cols>';

  let rowsXml = "";
  aoa.forEach((row,ri)=>{
    const r = ri+1;
    let cells = "";
    row.forEach((v,ci)=>{
      const ref = colLetter(ci)+r;
      const st = (ri===0) ? 1 : (ci===7 ? 3 : 2);
      const text = String(v==null?"":v);
      if(text==="") { cells += '<c r="'+ref+'" s="'+st+'"/>'; return; }
      cells += '<c r="'+ref+'" s="'+st+'" t="inlineStr"><is><t xml:space="preserve">'+xe2(text)+'</t></is></c>';
    });
    rowsXml += '<row r="'+r+'">'+cells+'</row>';
  });

  zip.folder("xl").folder("worksheets").file("sheet1.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<sheetFormatPr defaultRowHeight="15"/>'+cols
    +'<sheetData>'+rowsXml+'</sheetData></worksheet>');

  return await zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

/* ---- 나이스 엑셀 채우기 (행동특성 · 학기말 등 어느 화면이든) ---- */
function openFillXlsx(cur){
  let wb=null, shName="", aoa=null, headRow=-1, noCol=-1, txtCol=-1, srcName="";

  openModal("나이스 엑셀 채우기 · "+cur.label, (b, close)=>{
    const body = el("div");

    function guessCols(){
      const H = (aoa[headRow]||[]).map(x=>String(x==null?"":x).replace(/\s/g,""));
      noCol = H.findIndex(h=>h==="번호");
      if(noCol<0) noCol = H.findIndex(h=>h.indexOf("번호")>=0);
      const pat = ["행동특성및종합의견","행동특성","종합의견","특기사항","세부능력및특기사항","내용","의견"];
      txtCol = -1;
      for(const q of pat){ const k = H.findIndex(h=>h.indexOf(q)>=0); if(k>=0){ txtCol=k; break; } }
      if(txtCol<0) txtCol = H.length-1;
    }

    async function load(file){
      srcName = file.name;
      const buf = await file.arrayBuffer();
      wb = XLSX.read(buf, {type:"array", cellStyles:true});
      shName = wb.SheetNames[0];
      aoa = XLSX.utils.sheet_to_json(wb.Sheets[shName], {header:1, defval:""});
      headRow = -1;
      for(let i=0;i<Math.min(aoa.length,10);i++){
        const row = aoa[i].map(x=>String(x==null?"":x).replace(/\s/g,""));
        if(row.some(h=>h.indexOf("번호")>=0)){ headRow=i; break; }
      }
      if(headRow<0) headRow = 0;
      guessCols();
      draw();
    }

    function draw(){
      body.innerHTML="";

      body.append(el("div",{style:"border:1px solid var(--line);background:var(--panel-2);padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.85"},
        el("div",{style:"font-weight:700;margin-bottom:4px"},"나이스가 준 파일에 문장만 채워 돌려드립니다"),
        el("div",null,"나이스 화면의 ",el("b",null,"[엑셀내려받기]"),"로 받은 파일을 올리면, 번호를 맞춰 ",cur.label," 문장을 채웁니다. 나머지 칸과 서식은 그대로 둡니다."),
        el("div",null,"받은 파일을 나이스의 ",el("b",null,"[엑셀업로드]"),"로 올리면 한 번에 들어갑니다."),
        el("div",{class:"muted",style:"margin-top:4px"},"올린 파일은 이 브라우저 안에서만 열립니다. 어디에도 보내지 않습니다.")));

      body.append(el("div",{class:"sub-title"},"① 나이스에서 내려받은 엑셀 올리기"));
      const fi = el("input",{type:"file",accept:".xlsx,.xls"});
      fi.addEventListener("change",()=>{ if(fi.files&&fi.files[0]) load(fi.files[0]).catch(()=>toast("파일을 읽지 못했습니다.")); });
      body.append(fi);

      if(!aoa){
        body.append(el("div",{class:"hint"},"* 파일을 올리면 어느 열을 채울지 고를 수 있습니다."));
        body.append(el("div",{style:"display:flex;justify-content:flex-end;margin-top:14px"},
          el("button",{class:"btn",onClick:close},"닫기")));
        return;
      }

      const H = (aoa[headRow]||[]).map(x=>String(x==null?"":x));
      body.append(el("div",{class:"sub-title",style:"margin-top:14px"},"② 어느 열을 채울까요"));
      const row = el("div",{class:"fbox"});
      const selT = el("select",{style:"min-width:200px"});
      H.forEach((h,idx)=> selT.append(el("option",{value:idx, selected: idx===txtCol? "selected":null}, (idx+1)+"열 · "+(h||"(이름 없음)"))));
      selT.addEventListener("change",()=>{ txtCol=parseInt(selT.value,10); draw(); });
      const selN = el("select",{style:"min-width:150px"});
      H.forEach((h,idx)=> selN.append(el("option",{value:idx, selected: idx===noCol? "selected":null}, (idx+1)+"열 · "+(h||"(이름 없음)"))));
      selN.addEventListener("change",()=>{ noCol=parseInt(selN.value,10); draw(); });
      row.append(el("div",{class:"f"}, el("label",null,"번호 열"), selN));
      row.append(el("div",{class:"f"}, el("label",null,"채울 열"), selT));
      body.append(row);
      body.append(el("div",{class:"hint"},"* 파일 : "+srcName+" · 시트 "+shName+" · 머리글 "+(headRow+1)+"행"));

      /* 미리보기 */
      const rows = autoPayload(cur);
      const map = {}; rows.forEach(r=>{ if(r.text) map[r.no]=r.text; });
      let hit=0, miss=[];
      const prev=[];
      for(let i=headRow+1;i<aoa.length;i++){
        const no = parseInt(String(aoa[i][noCol]||"").trim(),10);
        if(!no) continue;
        if(map[no]){ hit++; prev.push([no, String(aoa[i][txtCol]||""), map[no]]); }
        else miss.push(no);
      }
      body.append(el("div",{class:"sub-title",style:"margin-top:14px"},"③ 채울 내용 "+hit+"명"));
      const tw = el("div",{style:"max-height:200px;overflow:auto;border:1px solid var(--line-soft)"});
      const t = el("table",{class:"grid"});
      t.append(el("thead",null, el("tr",null,
        el("th",{style:"width:56px"},"번호"), el("th",{style:"width:34%"},"지금 파일에 있는 내용"), el("th",null,"채울 내용"))));
      const tb = el("tbody");
      prev.forEach(x=>{
        tb.append(el("tr",null,
          el("td",{style:"text-align:center"}, x[0]+"번"),
          el("td",{style:"font-size:12px"}, x[1]? el("span",{style:"color:var(--warn)"}, x[1].slice(0,26)+(x[1].length>26?"…":"")) : el("span",{class:"muted"},"(비어 있음)")),
          el("td",{style:"font-size:12px"}, x[2].slice(0,34)+(x[2].length>34?"…":""))));
      });
      t.append(tb); tw.append(t); body.append(tw);
      if(miss.length) body.append(el("div",{class:"hint"},"* 문장이 없어 그대로 두는 번호 : "+miss.join(", ")+"번"));
      if(prev.some(x=>x[1])) body.append(el("div",{class:"hint",style:"color:var(--warn)"},"* 주황색으로 보이는 칸은 파일에 이미 내용이 있습니다. 덮어씁니다."));

      body.append(el("div",{style:"display:flex;gap:6px;justify-content:flex-end;margin-top:14px"},
        el("button",{class:"btn",onClick:close},"닫기"),
        el("button",{class:"btn pri lg", disabled: hit?null:"disabled", onClick:()=>{
          try{
            const ws = wb.Sheets[shName];
            let n=0;
            for(let i=headRow+1;i<aoa.length;i++){
              const no = parseInt(String(aoa[i][noCol]||"").trim(),10);
              if(!no || !map[no]) continue;
              const ref = XLSX.utils.encode_cell({r:i, c:txtCol});
              const old = ws[ref];
              ws[ref] = {t:"s", v: map[no], w: map[no], s: old&&old.s? old.s : undefined};
              n++;
            }
            const out = XLSX.write(wb, {bookType:"xlsx", type:"array", cellStyles:true});
            const base = srcName.replace(/\.(xlsx|xls)$/i,"");
            saveFile(base+"_작성완료.xlsx", out);
            toast(n+"명분을 채웠습니다. 나이스에서 [엑셀업로드]로 올리세요.", 4200);
          }catch(e){ toast("파일을 만들지 못했습니다.", 3200); }
        }},"채워서 내려받기")));
    }
    b.append(body); draw();
  },{width:"820px"});
}

/* ---- 순서대로 붙여넣기 러너 ---- */
function runnerSet(no, cur, v){
  const stu = S.students.find(x=>x.no===no);
  if(!stu) return;
  const sm = sem(stu, SEM);
  const kind = autoKindOf(cur.key);
  const cfg = AUTO_CFG[kind];
  if(cfg && cfg.cum && AUTOROUND){
    sm.split[kind] = sm.split[kind]||{};
    sm.split[kind][AUTOROUND] = v;
  } else {
    cur.set(sm, v);
  }
}

function openPasteRunner(cur, rows, cfg){
  let all = rows.slice();
  const state = {};                  // no -> "done" | "blank" | "skip"
  let i = 0;
  let keyHandler = null;
  let editing = false;

  openModal("순서대로 붙여넣기 · "+cfg.title, (b, done)=>{
    const body = el("div");

    function reload(){ all = autoPayload(cur); }   // 고친 내용을 매번 다시 읽는다
    function copyCur(){ const r = all[i]; if(r && r.text) copyText(r.text); }
    function go(step){
      const k = i + step;
      if(k < 0) return;
      editing = false;
      i = Math.min(k, all.length);
      draw(); copyCur();
    }
    function mark(m){ const r = all[i]; if(r) state[r.no] = m; go(1); }

    function draw(){
      reload();
      body.innerHTML="";
      const total = all.length;
      const doneN  = Object.keys(state).filter(k=>state[k]==="done").length;
      const blankN = Object.keys(state).filter(k=>state[k]==="blank").length;
      const skipN  = Object.keys(state).filter(k=>state[k]==="skip").length;

      const top = el("div",{style:"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"});
      top.append(el("span",{style:"font-weight:700"}, cfg.title));
      top.append(el("span",{class:"muted",style:"font-size:12.5px"},
        "붙여넣음 "+doneN+" · 비움 "+blankN+(skipN?(" · 건너뜀 "+skipN):"")+" · 전체 "+total));
      top.append(el("div",{style:"flex:1"}));
      top.append(el("button",{class:"btn sm",onClick:()=>{ done(); render(); }},"닫기"));
      body.append(top);
      const bar = el("div",{class:"prog",style:"margin-bottom:12px"});
      bar.append(el("i",{style:"width:"+Math.round(Math.min(i,total)/Math.max(total,1)*100)+"%"}));
      body.append(bar);

      if(i>=all.length){
        body.append(el("div",{style:"padding:30px;text-align:center"},
          el("div",{style:"font-size:19px;font-weight:700;margin-bottom:8px"},"끝났습니다"),
          el("div",{class:"muted"}, "붙여넣은 칸 "+doneN+"개 · 비워 둔 칸 "+blankN+"개"+(skipN?(" · 건너뛴 칸 "+skipN+"개"):"")),
          el("div",{class:"hint",style:"margin-top:10px"},"나이스에서 [저장]을 누르는 것을 잊지 마세요.")));
        body.append(el("div",{style:"display:flex;gap:6px;justify-content:center;margin-top:8px"},
          el("button",{class:"btn",onClick:()=>{ Object.keys(state).forEach(k=>delete state[k]); i=0; draw(); copyCur(); }},"처음부터 다시"),
          el("button",{class:"btn pri",onClick:()=>{ done(); render(); }},"닫기")));
        return;
      }

      const r = all[i];
      const empty = !r.text;

      const card = el("div",{style:"border:2px solid "+(empty?"var(--line)":"var(--blue)")+";background:var(--panel);padding:16px 18px"});
      const head = el("div",{style:"display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap"},
        el("span",{class:"numbadge",style:"font-size:17px;padding:4px 14px;"+(empty?"background:var(--ink-3)":"")}, r.no+"번"),
        empty
          ? el("span",{style:"font-size:12.5px;color:var(--warn);font-weight:700"}, r.why||"문장 없음")
          : el("span",{class:"muted",style:"font-size:12.5px"}, "공백 포함 "+r.text.length+"자"),
        el("div",{style:"flex:1"}),
        el("button",{class:"btn sm",onClick:()=>{ editing=!editing; draw(); }}, editing? "고치기 끝내기":"고치기"),
        empty ? el("span",{class:"muted",style:"font-size:12.5px"},"복사하지 않음")
              : el("span",{style:"color:var(--ok);font-size:12.5px;font-weight:700"},"복사됨 ✓"));
      card.append(head);

      if(editing){
        const ta = el("textarea",{rows:"5",style:"width:100%"});
        ta.value = r.text||"";
        let tmr=null;
        ta.addEventListener("input",()=>{
          runnerSet(r.no, cur, ta.value);
          clearTimeout(tmr);
          tmr = setTimeout(()=>{ save(true); copyText(ta.value.trim()); toast("저장하고 다시 복사했습니다."); }, 1200);
        });
        card.append(ta);
        card.append(el("div",{class:"hint",style:"margin-top:4px"},"* 고치면 1~2초 뒤 저장되고 그 내용으로 다시 복사됩니다."));
        setTimeout(()=>{ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); },30);
      } else {
        const show = el("div", empty
          ? {class:"muted",style:"font-size:14px;line-height:1.8;cursor:pointer"}
          : {style:"white-space:pre-wrap;line-height:1.85;font-size:14.5px;max-height:190px;overflow:auto;cursor:pointer"},
          empty? "이 번호는 비워 둡니다. 나이스에서 붙여넣지 말고 그대로 지나가세요." : r.text);
        show.addEventListener("click",()=>mark(empty?"blank":"done"));
        show.title = "눌러서 다음으로";
        card.append(show);
      }
      body.append(card);

      const hint = el("div",{class:"hint"});
      hint.append(el("div",null, empty ? "이 칸에는 붙여넣지 않습니다."
                                       : ("나이스의 "+r.no+"번 칸에 Ctrl+V 로 붙여넣으세요.")));
      if(i+1 < all.length){
        hint.append(el("div",null,"그 자리에서 ", el("b",null,"Tab "+cfg.tabs+"번"), "을 누르면 다음 ",
          el("b",null, all[i+1].no+"번"), " 칸입니다."));
      } else {
        hint.append(el("div",null,"이것이 마지막 번호입니다."));
      }
      body.append(hint);

      const rightBtns = el("div",{style:"display:flex;gap:6px"});
      if(!empty) rightBtns.append(el("button",{class:"btn",onClick:()=>{ copyCur(); toast("다시 복사했습니다."); }},"다시 복사"));
      rightBtns.append(el("button",{class:"btn",onClick:()=>mark("skip")},"잠긴 칸"));
      rightBtns.append(el("button",{class:"btn pri lg",onClick:()=>mark(empty?"blank":"done")},
        empty? "비우고 다음 ▶" : "붙여넣고 다음 ▶"));
      body.append(el("div",{style:"display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap;margin-top:10px"},
        el("button",{class:"btn",onClick:()=>go(-1)},"◀ 이전"), rightBtns));
      body.append(el("div",{class:"hint",style:"margin-top:2px"},
        "키보드: Enter 또는 → 다음 · ← 이전 · S 잠긴 칸"));

      const strip = el("div",{style:"display:flex;flex-wrap:wrap;gap:4px;margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px"});
      all.forEach((x,idx)=>{
        const st = state[x.no];
        const isCur = idx===i;
        let bg="var(--panel-2)", fg="var(--ink-2)", bd="var(--line)";
        if(!x.text){ bg="transparent"; fg="var(--ink-3)"; }
        if(st==="done"){ bg="#d9f2e3"; fg="#0d5c3c"; bd="#9cd8ba"; }
        if(st==="blank"||st==="skip"){ bg="var(--head)"; fg="var(--ink-3)"; }
        if(isCur){ bg="var(--blue)"; fg="#fff"; bd="var(--blue-d)"; }
        strip.append(el("button",{
          style:"min-width:34px;border:1px solid "+bd+";background:"+bg+";color:"+fg+";border-radius:2px;padding:2px 6px;font-size:12px;font-weight:"+(isCur?"700":"400"),
          title: x.text? (x.no+"번으로 이동") : (x.no+"번 — "+(x.why||"문장 없음")),
          onClick:()=>{ editing=false; i=idx; draw(); copyCur(); }
        }, x.no));
      });
      body.append(strip);
    }

    keyHandler = (e)=>{
      if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if(e.key==="Enter"||e.key==="ArrowRight"){ e.preventDefault(); const r=all[i]; if(r) state[r.no]= r.text? "done":"blank"; go(1); }
      else if(e.key==="ArrowLeft"){ e.preventDefault(); go(-1); }
      else if(e.key==="s"||e.key==="S"||e.key==="ㄴ"){ e.preventDefault(); const r=all[i]; if(r) state[r.no]="skip"; go(1); }
    };
    document.addEventListener("keydown", keyHandler);

    b.append(body);
    draw();
    copyCur();
  },{width:"660px"});

  const root = document.getElementById("modalRoot");
  const obs = new MutationObserver(()=>{
    if(!root.querySelector(".modal-bg")){
      if(keyHandler) document.removeEventListener("keydown", keyHandler);
      obs.disconnect();
    }
  });
  obs.observe(root, {childList:true, subtree:true});
}

/* ---------- 항목별 번호순 보기 ---------- */
const CCA_LABEL = {auto:"자율활동", club:"동아리활동", career:"진로활동", service:"봉사활동"};

function itemDefs(){
  const out = [];
  out.push({key:"behavior", label:"행동특성 및 종합의견", chip:"행동특성", group:"행동",
            limit:LIMITS.behavior, get:sm=>sm.out.behavior, set:(sm,v)=>{ sm.out.behavior=v; }});
  S.subjects.forEach(sj=>{
    out.push({key:"term:"+sj, label:"학기말 종합의견 · "+sj, chip:sj, group:"학기말",
              limit:LIMITS.term, get:sm=>sm.out.term[sj], set:(sm,v)=>{ sm.out.term[sj]=v; }});
  });
  CCA_KEYS.forEach(k=>{
    out.push({key:"cca:"+k, label:"창의적 체험활동 · "+CCA_LABEL[k], chip:CCA_LABEL[k], group:"창체",
              limit:LIMITS.cca, get:sm=>sm.out[k], set:(sm,v)=>{ sm.out[k]=v; }});
  });
  return out;
}
function ccaAreaOf(key){ return key.indexOf("cca:")===0 ? key.slice(4) : null; }
function stuActs(stu, area){ return ((sem(stu,SEM).cca[area])||[]).map(x=>x.n); }
function ccaGroups(area){
  const counts={}; let none=0;
  S.students.forEach(stu=>{
    const arr = stuActs(stu, area);
    if(!arr.length){ none++; return; }
    arr.forEach(n=>{ counts[n]=(counts[n]||0)+1; });
  });
  const cat = (S.ccaCat[area] && S.ccaCat[area].items) ? S.ccaCat[area].items.map(i=>i.n) : [];
  const names = Object.keys(counts).sort((a,b)=>{
    const ia=cat.indexOf(a), ib=cat.indexOf(b);
    return (ia<0?999:ia)-(ib<0?999:ib);
  });
  return {names:names, counts:counts, none:none};
}
function inCcaGroup(stu, area){
  if(!CCAGROUP) return true;
  const arr = stuActs(stu, area);
  if(CCAGROUP==="__none__") return arr.length===0;
  return arr.indexOf(CCAGROUP)>=0;
}

/* ---------- 결과 칸 (클릭 수정 + 자동 저장 + 복사) ---------- */
function outField(title, limit, get, set, small){
  const fld = el("div",{class:"fld"});
  const cnt = el("span",{class:"cnt"});
  const tag = el("span",{class:"savetag"});
  const head = el("div",{class:"fld-h"}, title, cnt, tag,
    el("button",{class:"btn sm",style:"margin-left:8px",onClick:()=>{
      const v=(get()||"").trim();
      if(!v){ toast("복사할 내용이 없습니다."); return; }
      copyText(v);
    }},"복사"));
  const body = el("div",{class:"fld-b"});
  const view = el("div",{class:"out"});
  let timer=null, editing=false;

  function refreshCnt(){
    const v = get()||"";
    cnt.textContent = v? ("공백 포함 "+v.length+"자 / "+limit+"자") : "";
    cnt.classList.toggle("over", v.length>limit);
  }
  function draw(){
    const v = get()||"";
    view.textContent = v || "아직 생성되지 않았습니다.";
    view.classList.toggle("empty", !v);
    refreshCnt();
  }
  view.addEventListener("click",()=>{
    if(editing) return;
    editing=true;
    const ta = el("textarea",{class:"out-edit",rows: small?"4":"6"});
    ta.value = get()||"";
    body.innerHTML=""; body.append(ta);
    const foot = el("div",{style:"display:flex;gap:6px;justify-content:flex-end;margin-top:6px"},
      el("button",{class:"btn sm",onClick:()=>{ editing=false; body.innerHTML=""; body.append(view); draw(); }},"편집 끝내기"));
    body.append(foot);
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.addEventListener("input",()=>{
      set(ta.value);
      refreshCnt();
      clearTimeout(timer);
      tag.textContent = "";
      timer = setTimeout(()=>{ save(true); tag.textContent="저장됨"; setTimeout(()=>{tag.textContent="";},1400); }, 1200);
    });
    ta.addEventListener("blur",()=>{ clearTimeout(timer); set(ta.value); save(true); tag.textContent="저장됨"; setTimeout(()=>{tag.textContent="";},1400); });
  });
  draw();
  body.append(view);
  fld.append(head, body);
  fld._redraw = draw;
  return fld;
}

   ============================================================ */
const gradeCache = {};   // sem -> {bySubject:{과목:{items,ts,by}}}
let redrawEvalList = null;
function normSchool(x){ return String(x||"").replace(/\s+/g,""); }
function gradeDocId(n){ return "ge"+hashKey(S.meta.year+"|"+normSchool(S.meta.school)+"|"+S.meta.grade+"|"+n); }

async function gradeEvalsGet(n, force){
  if(!DB) return null;
  if(!force && gradeCache[n]!==undefined) return gradeCache[n];
  try{
    const snap = await DB.doc("gradeEvals/"+gradeDocId(n)).get();
    gradeCache[n] = (snap && snap.exists) ? clone(snap.data()||null) : null;
  }catch(e){ gradeCache[n] = null; }
  return gradeCache[n];
}
async function gradeEvalsPublish(n, subject){
  if(!DB) throw {code:"unavailable"};
  const items = (S.evals[n]||[]).filter(e=>e.subject===subject).map(e=>({std:e.std||"", content:e.content||""}));
  const cur = await gradeEvalsGet(n, true);
  const by = (cur && cur.bySubject) ? cur.bySubject : {};
  by[subject] = {items:items, ts:Date.now(), by:"학년부장 "+S.meta.cls+"반"};
  const doc = {school:normSchool(S.meta.school), grade:S.meta.grade, year:S.meta.year, sem:n,
               bySubject:by, updatedAt:Date.now()};
  await DB.doc("gradeEvals/"+gradeDocId(n)).set(doc);
  gradeCache[n] = doc;
  S.recv[n][subject] = by[subject].ts;
  save(true);
}
function gradeReceive(n, subject, entry){
  S.evals[n] = (S.evals[n]||[]).filter(e=>e.subject!==subject);
  (entry.items||[]).forEach(it=> S.evals[n].push({subject:subject, std:it.std||"", content:it.content||""}));
  S.recv[n][subject] = entry.ts||Date.now();
  save(true);
}
function gradeNewCount(n){
  const d = gradeCache[n];
  if(!d || !d.bySubject) return 0;
  let c=0;
  S.subjects.forEach(sj=>{
    const e = d.bySubject[sj];
    if(e && (e.ts||0) > (S.recv[n][sj]||0)) c++;
  });
  return c;
}
async function refreshGradeBanner(){
  if(!DB) return;
  await gradeEvalsGet(SEM, true);
  const host = document.getElementById("gradeBanner");

  host.innerHTML="";

      if(!sameSchool || !sameGrade) info.append(el("div",{style:"color:var(--warn);margin-top:4px"},
        "지금 학급("+S.meta.school+" "+S.meta.grade+"학년)과 다릅니다. 그래도 받아올 수는 있습니다."));
      if(!sameSem) info.append(el("div",{style:"color:var(--warn);margin-top:4px"},
        "파일은 "+doc.sem+"학기인데 지금은 "+n+"학기입니다. 받으면 "+n+"학기에 들어갑니다."));

      /* 과목 고르기 */
      body.append(el("div",{class:"sub-title"},"받아올 과목 고르기"));
      const tw = el("div",{style:"max-height:260px;overflow:auto;border:1px solid var(--line-soft)"});
      const t = el("table",{class:"grid"});
      t.append(el("thead",null, el("tr",null,
        el("th",{style:"width:46px"},""), el("th",{style:"width:120px"},"과목"),
        el("th",{style:"width:90px"},"받을 건수"), el("th",null,"첫 성취기준"))));
      const tb = el("tbody");
      Object.keys(doc.subjects).forEach(sj=>{
        const list = doc.subjects[sj]||[];
        const mine = (S.evals[n]||[]).filter(e=>e.subject===sj).length;
        const cb = el("input",{type:"checkbox",style:"width:15px;height:15px"});
        cb.checked = !!picked[sj];
        cb.addEventListener("change",()=>{ picked[sj]=cb.checked; });
        tb.append(el("tr",null,
          el("td",{style:"text-align:center"}, cb),
          el("td",null, sj, mine? el("div",{style:"font-size:11px;color:var(--warn)"},"내 평가 "+mine+"건 덮어씀") : null),
          el("td",{style:"text-align:center"}, list.length+"건"),
          el("td",{style:"font-size:12px"}, (list[0]&&list[0].std)? list[0].std.slice(0,40)+(list[0].std.length>40?"…":"") : el("span",{class:"muted"},"—"))));
      });
      t.append(tb); tw.append(t); body.append(tw);
      body.append(el("div",{class:"hint"},"* 고른 과목의 내 평가 목록이 파일 내용으로 바뀝니다. 받은 뒤 반에 맞게 고쳐 쓰셔도 됩니다."));

      body.append(el("div",{style:"display:flex;gap:6px;justify-content:flex-end;margin-top:14px"},
        el("button",{class:"btn",onClick:close},"닫기"),
        el("button",{class:"btn pri lg",onClick:async()=>{
          const take = Object.keys(picked).filter(k=>picked[k]);
          if(!take.length){ toast("받아올 과목을 하나 이상 골라 주세요."); return; }
          const hasMine = take.some(sj=>(S.evals[n]||[]).some(e=>e.subject===sj));
          if(hasMine && !await confirmBox("평가 받아오기", take.join(", ")+" 과목의 내 평가를 파일 내용으로 바꿉니다.")) return;
          let cnt=0;
          take.forEach(sj=>{
            S.evals[n] = (S.evals[n]||[]).filter(e=>e.subject!==sj);
            (doc.subjects[sj]||[]).forEach(it=>{
              S.evals[n].push({subject:sj, std:it.std||"", content:it.content||""});
              cnt++;
            });
            if(S.subjects.indexOf(sj)<0) S.subjects.push(sj);   // 안 켜 둔 과목이면 함께 켠다
            S.recv[n][sj] = Date.now();
          });
          save(true);
          toast(take.length+"과목 "+cnt+"건을 받아왔습니다.", 3600);
          close(); after && after(); render();
        }},"선택한 과목 받아오기")));
    }
    b.append(body); draw();
  },{width:"740px"});
}

    el("div",{style:"flex:1"}),
    el("button",{class:"btn sm pri",onClick:()=>exportEvalFile(n)},"⭳ 평가 파일 내보내기"),

  fileRow.append(el("div",{style:"font-size:12.5px;line-height:1.8;color:var(--ink-2)"},
    "학년부장 선생님이 ", el("b",null,"내보내기"), "로 받은 작은 파일을 메신저나 메일로 보내 주면, 받은 분이 ",
    el("b",null,"불러오기"), "로 올립니다. 과목을 골라 받을 수 있습니다."));
  box.append(fileRow);

  box.append(el("div",{style:"font-weight:700;font-size:12.5px;color:var(--ink-2);margin-bottom:6px"},
    (S.lead? "같은 화면을 함께 쓸 때 · 학년 전체에 일괄 등록" : "같은 화면을 함께 쓸 때 · 학년부장이 배포한 평가")));
  const rows = el("div");
  box.append(rows);
  box.append(el("div",{class:"hint"}, S.lead
    ? "* 과목별로 [학년 전체에 일괄 등록]을 누르면, 같은 학교·학년으로 접속한 다른 반 선생님이 그 과목 평가를 그대로 받아갈 수 있습니다."
    : "* [받아오기]를 누르면 그 과목의 내 평가 목록이 배포본으로 바뀝니다. 받은 뒤 반에 맞게 고쳐 쓰셔도 됩니다."));
  box.append(el("div",{class:"hint",style:"margin-top:2px;color:var(--ink-3)"},
    "* 여기에 올린 성취기준·평가 내용은 같은 학교·학년으로 접속한 분들이 함께 봅니다. 학생 개인정보는 넣지 마세요."));

  function draw(){
    rows.innerHTML="";
    if(!DB){
      rows.append(el("div",{class:"muted",style:"padding:10px"},"학년 공동 평가를 준비하는 중입니다. 잠시 뒤 다시 열어 주세요."));
      return;
    }
    if(!S.subjects.length){
      rows.append(el("div",{class:"muted",style:"padding:10px"},"먼저 ‘학급 설정’에서 과목을 골라 주세요."));
      return;
    }
    const d = gradeCache[n];
    const by = (d && d.bySubject) ? d.bySubject : {};
    S.subjects.forEach(sj=>{
      const mine = (S.evals[n]||[]).filter(e=>e.subject===sj).length;
      const ent = by[sj];
      const isNew = ent && (ent.ts||0) > (S.recv[n][sj]||0);
      const r = el("div",{style:"display:flex;gap:9px;align-items:center;flex-wrap:wrap;border:1px solid "+(isNew?"var(--blue)":"var(--line-soft)")+";background:var(--panel);padding:8px 10px;margin-bottom:6px"});
      r.append(el("div",{style:"min-width:92px;font-weight:700"}, sj));
      const info = el("div",{style:"flex:1;font-size:12px;color:var(--ink-2)"});
      info.append(el("div",null,"내 평가 "+mine+"건"));
      info.append(el("div",null, ent
        ? ("배포본 "+(ent.items||[]).length+"건 · "+new Date(ent.ts||0).toLocaleString("ko-KR")+(isNew?" · 새 배포":""))
        : "배포된 평가 없음"));
      r.append(info);

      if(S.lead){
        r.append(el("button",{class:"btn pri sm", disabled: mine?null:"disabled", onClick:async(e)=>{
          const btn=e.target; btn.disabled=true; btn.textContent="등록 중…";
          try{
            await gradeEvalsPublish(n, sj);
            toast(sj+" 평가 "+mine+"건을 학년 전체에 등록했습니다.");
          }catch(err){ toast("등록하지 못했습니다. 잠시 뒤 다시 시도해 주세요.",3200); }
          btn.disabled=false; btn.textContent="학년 전체에 일괄 등록"; draw();
        }},"학년 전체에 일괄 등록"));
      }
      if(ent && (ent.items||[]).length){
        r.append(el("button",{class:isNew?"btn pri sm":"btn sm", onClick:async()=>{
          if(mine && !await confirmBox("평가 받아오기", sj+" 과목의 내 평가 "+mine+"건을 배포본 "+(ent.items||[]).length+"건으로 바꿉니다.")) return;
          gradeReceive(n, sj, ent);
          toast(sj+" 평가를 받아왔습니다.");
          draw(); if(typeof redrawEvalList==="function") redrawEvalList();
        }},"받아오기"));
      }
      rows.append(r);
    });
    const anyNew = S.subjects.some(sj=> by[sj] && (by[sj].ts||0) > (S.recv[n][sj]||0));
    if(anyNew){
      rows.append(el("div",{style:"display:flex;justify-content:flex-end;margin-top:4px"},
        el("button",{class:"btn",onClick:async()=>{
          if(!await confirmBox("전체 받아오기","배포된 모든 과목의 평가를 받아옵니다. 해당 과목의 내 평가는 배포본으로 바뀝니다.")) return;
          S.subjects.forEach(sj=>{ if(by[sj] && (by[sj].items||[]).length) gradeReceive(n, sj, by[sj]); });
          toast("배포된 평가를 모두 받아왔습니다.");
          draw(); if(typeof redrawEvalList==="function") redrawEvalList();
        }},"배포된 평가 모두 받아오기")));
    }
  }
  box._draw = draw;
  draw();
  gradeEvalsGet(n, true).then(()=>draw());
  return box;
}

function ccaSection(k, sm){
  const cat = S.ccaCat[k];
  const wrap = el("div",{class:"cat"});
  const h = el("div",{class:"cat-h"}, cat.label);
  const tools = el("div",{class:"tools"});
  let editing=false;
  const bEdit = el("button",{class:"btn sm ghost"},"항목 편집");
  const bAdd = el("button",{class:"btn sm"},"+ 활동 추가");
  tools.append(bEdit,bAdd); h.append(tools);
  const body = el("div",{class:"cat-b"});
  const chips = el("div",{class:"chips"});
  const detail = el("div",{style:"margin-top:9px"});

  function picked(n){ return sm.cca[k].find(x=>x.n===n); }
  function drawChips(){
    chips.innerHTML="";
    cat.items.forEach((it,i)=>{
      const on = !!picked(it.n);
      const c = el("button",{class:"chip","aria-pressed":on?"true":"false",onClick:async()=>{
        if(editing){
          const v = await askText("활동 설명 수정", it.n+" 활동 설명", it.d||"", true);
          if(v!==null){ it.d=v; save(); toast("설명을 수정했습니다."); }
          return;
        }
        if(on) sm.cca[k] = sm.cca[k].filter(x=>x.n!==it.n);
        else sm.cca[k].push({n:it.n, obs:"", period:""});
        save(); drawChips(); drawDetail();
      }}, it.n);
      if(ROLE_NAMES.includes(it.n)) c.prepend(el("span",{style:"opacity:.65;font-size:10.5px;margin-right:4px"},"직위"));
      if(editing){
        c.append(el("span",{class:"del",onClick:async(e)=>{
          e.stopPropagation();
          if(!await confirmBox("활동 삭제","‘"+it.n+"’ 활동을 목록에서 삭제합니다.")) return;
          sm.cca[k] = sm.cca[k].filter(x=>x.n!==it.n);
          cat.items.splice(i,1); save(); drawChips(); drawDetail();
        }},"✕"));
      }
      chips.append(c);
    });
  }
  function drawDetail(){
    detail.innerHTML="";
    if(!sm.cca[k].length){ detail.append(el("div",{class:"muted",style:"font-size:12px"},"선택한 활동이 없습니다.")); return; }
    sm.cca[k].forEach(sel=>{
      const meta = cat.items.find(x=>x.n===sel.n) || {d:""};
      const box = el("div",{style:"border:1px solid var(--line-soft);padding:8px;margin-bottom:6px;background:var(--panel-2)"});
      box.append(el("div",{style:"font-weight:700;margin-bottom:4px"}, sel.n,
        el("span",{class:"muted",style:"font-weight:400;margin-left:7px;font-size:11.5px"}, meta.d||"")));
      if(ROLE_NAMES.includes(sel.n)){

/* ============================================================
   12. 문장 생성
   ============================================================ */
function subjectsWithEval(n){
  const evs = S.evals[n]||[];
  return S.subjects.filter(sj=> evs.some(e=>e.subject===sj));
}
/* ============================================================
   12. 문장 생성 — 규칙 조립 (AI를 부르지 않습니다)

   고른 갈래 항목마다 문장 변형을 하나씩 뽑아 이어 붙인다.
   번호마다 다른 변형이 가도록 i를 n진수로 풀어 더하고,
   그래도 겹치는 자리가 남으면 생성 뒤에 보정 단계가 다시 뽑는다.
   ============================================================ */
const JOIN = ["", "또한 ", "아울러 ", "이와 함께 ", "한편 "];

function tri(s){ const g=new Set(); const t=String(s).replace(/\s/g,""); for(let i=0;i<=t.length-3;i++) g.add(t.slice(i,i+3)); return g; }
function sim(a,b){ const A=tri(a),B=tri(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(x=>{if(B.has(x))n++;}); return n/(A.size+B.size-n); }

/* 받침이 있으면 '으로서', 없으면 '로서' */
function roseo(w){ const c=w.charCodeAt(w.length-1)-0xAC00; if(c<0||c>11171) return "으로서"; return (c%28)===0? "로서":"으로서"; }

/* 변형 고르기.
   i를 n진수로 풀어 더하지 않으면 배정 주기와 변형 개수가 맞물릴 때 겹친다
   (1·11·21번이 같은 문장). 첫 자리에는 i/L 을 한 번 더 더해 첫 문장을 갈라 놓는다.
   한 학생 안에서는 같은 문장도, 거의 같은 문장도 두 번 쓰지 않는다. */
function pickV(list, i, pos, L, used, seed){
  const n = list.length;
  if(!n) return "";
  const base = (i*(pos+1) + Math.floor(i/n) + Math.floor(i/(n*n))
              + (pos===0 ? Math.floor(i/L) : 0) + seed + pos*3) % n;
  let fallback = null;
  for(let t=0;t<n;t++){
    const v = list[((base+t)%n+n)%n];
    if(used.has(v)) continue;
    if(fallback===null) fallback = v;
    let near=false;
    for(const u of used){ if(sim(u,v) >= 0.6){ near=true; break; } }
    if(!near){ used.add(v); return v; }
  }
  const v = fallback!==null? fallback : list[((base%n)+n)%n];
  used.add(v); return v;
}
function joinTrim(parts, i, limit){
  parts = parts.filter(x=>x && x.trim());
  if(!parts.length) return "";
  const build = ps => ps.map((p,j)=>(j===0?"":JOIN[(i+j)%JOIN.length]) + p.replace(/\.+$/,"") + ".").join(" ");
  let out = build(parts);
  while(out.length > limit && parts.length > 1){ parts = parts.slice(0,-1); out = build(parts); }
  return out;
}
/* parts: [{v:[문장...], obs:"관찰 장면", lead:{name,period}|null}] */
function assembleParts(parts, i, used, seed, limit, tailObs){
  parts = parts.filter(p=>p && ((p.v&&p.v.length) || (p.obs&&p.obs.trim())));
  if(!parts.length){
    const ck = checkObs(tailObs);
    return (tailObs && !ck.blocks.length) ? joinTrim([tailObs], i, limit) : "";
  }
  const L = parts.length;
  const rot = i % L;
  const order = parts.slice(rot).concat(parts.slice(0, rot));
  const out = [];
  order.forEach((p,pos)=>{
    if(p.v && p.v.length){
      let s = pickV(p.v, i, pos, L, used, seed);
      if(p.lead) s = p.lead.name + roseo(p.lead.name) + " (" + ((p.lead.period||"").trim() || "기간 미입력") + ") 동안 " + s;
      out.push(s);
    }
    /* 관찰 장면은 그 갈래 문장 바로 뒤에 붙인다. 막힌 장면은 넣지 않는다. */
    if(p.obs && p.obs.trim() && !checkObs(p.obs).blocks.length) out.push(p.obs.trim());
  });
  if(tailObs && tailObs.trim() && !checkObs(tailObs).blocks.length) out.push(tailObs.trim());
  return joinTrim(out, i, limit);
}

/* 갈래 선택 → 조립 재료 */
function behavParts(sm){
  const out=[];
  S.behavTax.forEach(cat=>{
    const s = sm.behavior[cat.id]; if(!s) return;
    const key = (cat.keys||[])[s.i] || null;
    out.push({v: key? (SENT[key]||[]) : [], obs: s.obs||""});
  });
  return out;
}
function termParts(sm){
  const out=[];
  S.termTax.forEach(cat=>{
    const s = sm.term[cat.id]; if(!s) return;
    const key = (cat.keys||[])[s.i] || null;
    out.push({v: key? (SENT[key]||[]) : [], obs: s.obs||""});
  });
  return out;
}
function ccaParts(sm, area, i, seed){
  const arr = sm.cca[area]||[];
  if(!arr.length) return [];
  const cat = S.ccaCat[area];
  const parts = arr.map(sel=>{
    const meta = (cat.items||[]).find(x=>x.n===sel.n) || {};
    const key = meta.k || null;
    return { v: key? (SENT[key]||[]) : [],
             obs: sel.obs||"",
             lead: (meta.role || ROLE_NAMES.includes(sel.n)) ? {name:sel.n, period:sel.period||""} : null };
  });
  /* 활동이 적으면 꼬리(참여 태도·역할·기여·전이)를 더 붙인다.
     학급이 다 함께 한 활동이어도 번호마다 문장이 갈린다. */
  const TN = TAIL_KEYS.length;
  const ai = CCA_KEYS.indexOf(area);
  const want = parts.length===1 ? 3 : parts.length===2 ? 2 : 1;
  const picked=[];
  for(let t=0;t<want;t++){
    const k = TAIL_KEYS[(i + ai*3 + seed + t*(1 + (i%(TN-1)))) % TN];
    if(!picked.includes(k)) picked.push(k);
  }
  picked.forEach(k=>parts.push({v: SENT[k]||[], obs:""}));
  return parts;
}

/* 학생 한 명 */
function ruleGenerate(idx, n){
  const stu = S.students[idx], sm = sem(stu, n), i = stu.no - 1;
  const base = (S.seed|0);
  sm.off = sm.off || {};
  const sd = key => base + (sm.off[key]||0);
  const used = new Set();

  sm.out.behavior = assembleParts(behavParts(sm), i, used, sd("behavior"), LIMITS.behavior, sm.extra||"");

  sm.out.term = sm.out.term || {};
  const tp = termParts(sm);
  sm.termObs = sm.termObs || {};
  S.subjects.forEach((sj, si)=>{
    sm.out.term[sj] = assembleParts(tp.map(p=>({v:p.v, obs:p.obs})), i, used,
                                    sd("term:"+sj) + si*7, LIMITS.term, sm.termObs[sj]||"");
  });
  CCA_KEYS.forEach(area=>{
    sm.out[area] = assembleParts(ccaParts(sm, area, i, sd("cca:"+area)), i, used, sd("cca:"+area), LIMITS.cca, "");
  });
}

/* 생성 뒤에 겹친 번호만 골라 다시 뽑는다.
   공식을 아무리 다듬어도 학급 전원이 같은 활동을 하면 겹치는 자리가 남는다. */
const REPAIR_SIM = 0.5;
function outKeys(){
  const ks = [["behavior", sm=>sm.out.behavior]];
  S.subjects.forEach(sj=>ks.push(["term:"+sj, sm=>(sm.out.term||{})[sj]||""]));
  CCA_KEYS.forEach(a=>ks.push(["cca:"+a, sm=>sm.out[a]||""]));
  return ks;
}
function repairDiversity(n){
  const sems = S.students.map(st=>sem(st, n));
  for(const [key, get] of outKeys()){
    for(let round=0; round<120; round++){
      const texts = sems.map(get);
      let worstIdx=-1, worst=0;
      for(let a=0;a<sems.length;a++){
        if(!texts[a]) continue;
        for(let b2=0;b2<a;b2++){
          if(!texts[b2]) continue;
          const v = texts[a]===texts[b2] ? 1
                  : (texts[a].split(".")[0]===texts[b2].split(".")[0] ? 0.99 : sim(texts[a],texts[b2]));
          if(v >= REPAIR_SIM && v > worst){ worst=v; worstIdx=a; }
        }
      }
      if(worstIdx<0) break;
      const sm = sems[worstIdx];
      sm.off = sm.off || {};
      sm.off[key] = (sm.off[key]||0) + 1;
      ruleGenerate(worstIdx, n);
    }
  }
}

function generateOne(idx, n, alone){
  ruleGenerate(idx, n);
  save(true);
  if(alone){ openState[idx]=true; render(); toast(S.students[idx].no+"번 문장을 만들었습니다."); }
  return true;
}
async function generateAll(n){
  if(!S.students.length){ toast("학생이 없습니다."); return; }

  if(!ok) return;
  const t0 = (window.performance&&performance.now)? performance.now() : 0;
  for(let i=0;i<S.students.length;i++) ruleGenerate(i, n);

function reseedAll(n){
  S.seed = ((S.seed|0)+1)%97;
  S.students.forEach(st=>{ const sm=sem(st,n); sm.off={}; });
  for(let i=0;i<S.students.length;i++) ruleGenerate(i, n);
  repairDiversity(n);
  save(true); render();
  toast("다른 변형으로 다시 만들었습니다.", 2400);
}

/* 번호마다 서로 다른 갈래 조합을 깔아 준다 (교사가 고칠 수 있다) */
function autoAssign(opt){
  const bc = S.behavTax, tc = S.termTax;
  S.students.forEach((stu,i)=>{
    const sm = sem(stu, SEM);
    if(opt.beh && bc.length){
      sm.behavior = {};
      for(let slot=0; slot<opt.behN; slot++){
        const cat = bc[(i*(slot*2+3) + slot*5) % bc.length];
        if(!cat || !cat.items.length) continue;
        if(sm.behavior[cat.id]) continue;
        sm.behavior[cat.id] = {i: (i*(slot+2)+slot*3) % cat.items.length, obs:""};
      }
    }
    if(opt.term && tc.length){
      sm.term = {};
      for(let slot=0; slot<opt.termN; slot++){
        const cat = tc[(i*(slot+2) + slot) % tc.length];
        if(!cat || !cat.items.length) continue;
        if(sm.term[cat.id]) continue;
        sm.term[cat.id] = {i: (i*(slot+3)) % cat.items.length, obs:""};
      }
    }
  });
}
