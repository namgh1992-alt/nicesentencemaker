function codeLines(tax, store){
  const out=[];
  tax.forEach(cat=>{
    const s = store[cat.id];
    if(!s) return;
    const label = cat.items[s.i];
    if(!label) return;
    out.push("- "+cat.name+": "+label+(s.obs&&s.obs.trim()? "  | 관찰 장면: "+s.obs.trim() : "  | 관찰 장면: (없음 — 이 특성에 맞게 학급에서 흔히 있을 법한 일반적 장면 수준으로만 서술)"));
  });
  return out;
}
function subjectsWithEval(n){
  const evs = S.evals[n]||[];
  return S.subjects.filter(sj=> evs.some(e=>e.subject===sj));
}
function buildPrompt(stu, n){
  const sm = sem(stu, n);
  const L=[];
  L.push("당신은 25년 경력의 초등학교 담임교사입니다. 학교생활기록부(NEIS)에 입력할 문장 초안을 씁니다.");
  L.push("");
  L.push("[학생] "+S.meta.grade+"학년 "+S.meta.cls+"반 "+stu.no+"번 / "+n+"학기");
  L.push("이름·성별·나이를 문장에 쓰지 말 것. 주어 없이 서술체로 쓸 것.");
  L.push("");
  L.push("[공통 제약]");
  L.push("- 어미는 '~함', '~임', '~보임', '~하였음'만 사용");
  L.push("- '착함, 성실함, 훌륭함, 바람직함, 모범적임' 같은 추상 평가어 금지");
  L.push("- 단정적인 성격 규정 금지");
  L.push("- 아래에 제시된 장면 밖의 내용을 추측하거나 지어내지 말 것");
  L.push("- 대회명, 지역명, 학교명, 인물명 등 학생을 특정할 수 있는 고유 정보 금지");
  L.push("- 선택 항목 이름이나 코드(A3, T2 등)를 문장에 그대로 쓰지 말고, 그런 특성이 드러난 '행동'으로 바꾸어 서술");
  L.push("- 약점은 단점으로 적지 말고 '변화 과정'으로 서술 (예: ~에 어려움이 있었으나 이후 ~하는 모습을 보임)");
  L.push("- 각 항목의 첫 문장 구조를 서로 다르게 할 것");
  L.push("- 직위 이름(학급회장 등)에 작은따옴표나 큰따옴표를 붙이지 말 것");
  L.push("");

  L.push("[1] 행동특성 및 종합의견 — 공백 포함 380자 이내");
  const bl = codeLines(S.behavTax, sm.behavior);
  L.push(bl.length? bl.join("\n") : "- (선택된 특성 없음: 학급 생활 전반을 담담하게 3~4문장으로만 서술)");
  if((sm.extra||"").trim()) L.push("- 담임 추가 관찰: "+sm.extra.trim());
  L.push("");

  const subs = subjectsWithEval(n);
  L.push("[2] 학기말 종합의견 — 과목마다 각각 공백 포함 380자 이내");
  const tl = codeLines(S.termTax, sm.term);
  L.push("공통 학습 특성:");
  L.push(tl.length? tl.join("\n") : "- (선택된 특성 없음: 성취기준과 평가 내용만으로 서술)");
  if(subs.length){
    L.push("과목별 평가 내역 (이 내용에만 근거해 서술):");
    subs.forEach(sj=>{
      L.push("· "+sj);
      (S.evals[n]||[]).filter(e=>e.subject===sj).forEach(e=>{
        if(e.std) L.push("   - 성취기준: "+e.std);
        if(e.content) L.push("     평가 내용: "+e.content);
      });
    });
  } else {
    L.push("(등록된 평가 내역 없음 → term은 빈 객체 {} 로 출력)");
  }
  L.push("");

  L.push("[3] 창의적 체험활동 — 영역마다 공백 포함 250자 이내");
  L.push("① 참여 태도 ② 역할 수행 ③ 기여 방식 ④ 배움의 전이(다른 장면으로 옮겨간 흔적) 중 한 가지를 중심으로 서술할 것.");
  const areaName = {auto:"자율활동",club:"동아리활동",career:"진로활동",service:"봉사활동"};
  const areaKeyOut = {auto:"auto",club:"club",career:"career",service:"service"};
  const usedAreas=[];
  CCA_KEYS.forEach(k=>{
    const arr = sm.cca[k]||[];
    if(!arr.length){ L.push("· "+areaName[k]+": (선택 없음 → \""+areaKeyOut[k]+"\"는 빈 문자열로 출력)"); return; }
    usedAreas.push(k);
    L.push("· "+areaName[k]+":");
    arr.forEach(sel=>{
      const meta = (S.ccaCat[k].items.find(x=>x.n===sel.n))||{d:""};
      let line = "   - "+sel.n+(meta.d? " ("+meta.d+")":"");
      if(ROLE_NAMES.includes(sel.n)) line += " ★직위 항목: 반드시 다음 형식 그대로 시작할 것 → "+sel.n+"으로서 ("+(sel.period||"기간 미입력")+") 동안 ~ (이끄는 역할에서 잘한 점을 이어서 서술). 직위 이름에 따옴표(' ' 또는 \" \")를 붙이지 말 것.";
      line += sel.obs&&sel.obs.trim()? " | 관찰 장면: "+sel.obs.trim() : " | 관찰 장면: (없음 — 활동 성격에 맞는 일반적 수준으로만 서술)";
      L.push(line);
    });
  });
  L.push("");
  L.push("[출력 형식] 아래 JSON 한 개만 출력할 것. 설명·머리말·코드펜스 금지.");
  const shape = {behavior:"문장", term:{}, auto:"", club:"", career:"", service:""};
  subs.forEach(sj=> shape.term[sj]="문장");
  L.push(JSON.stringify(shape, null, 0));
  return L.join("\n");
}

let genAbort = null, genRunning=false;

async function ensureSample(){
  if(SAMPLE) return SAMPLE;
  await capInit();          // 준비가 끝날 때까지 기다린다
  return SAMPLE;
}
async function generateOne(idx, n, alone){
  const s = await ensureSample();
  if(!s){ capState="nosample"; refreshCapWarn(); toast("이 창에서는 문장 생성을 쓸 수 없습니다. 위쪽 안내를 읽어 주세요.", 3600); return false; }
  const stu = S.students[idx];
  const sm = sem(stu, n);
  if(alone){ toast(stu.no+"번 문장을 만드는 중입니다…", 2600); }
  try{
    const data = await s.json(buildPrompt(stu, n), {modelTier:"default", cache:false, signal: genAbort? genAbort.signal : undefined});
    applyResult(sm, data);
    save(true);
    if(alone){ openState[idx]=true; render(); toast(stu.no+"번 문장을 만들었습니다."); }
    return true;
  }catch(e){
    const msg = {
      not_granted:"Claude 사용이 허용되지 않아 문장을 만들 수 없습니다.",
      sampling_disabled:"이 계정에서는 문장 생성을 쓸 수 없습니다.",
      rate_limited:"요청이 많아 잠시 멈췄습니다. 조금 뒤 다시 눌러 주세요.",
      invalid_json:"결과 형식이 어긋났습니다. 다시 한 번 눌러 주세요.",
      cancelled:"생성을 중지했습니다.",
      session_expired:"다시 로그인한 뒤 시도해 주세요."
    }[e && e.code] || "문장 생성에 실패했습니다. 다시 시도해 주세요.";
    if(alone || e.code==="not_granted" || e.code==="rate_limited") toast(msg, 3200);
    if(e.code==="not_granted"||e.code==="sampling_disabled") SAMPLE=null;
    return false;
  }
}
function applyResult(sm, data){
  if(!data || typeof data!=="object") return;
  if(typeof data.behavior==="string" && data.behavior.trim()) sm.out.behavior = data.behavior.trim();
  if(data.term && typeof data.term==="object"){
    Object.keys(data.term).forEach(k=>{ if(typeof data.term[k]==="string" && data.term[k].trim()) sm.out.term[k]=data.term[k].trim(); });
  }
  CCA_KEYS.forEach(k=>{ if(typeof data[k]==="string" && data[k].trim()) sm.out[k]=data[k].trim(); });
}

async function generateAll(n){
  if(genRunning){ toast("이미 만들고 있습니다."); return; }
  const s = await ensureSample();
  if(!s){ capState="nosample"; refreshCapWarn(); toast("이 창에서는 문장 생성을 쓸 수 없습니다. 위쪽 안내를 읽어 주세요.", 3600); return; }
  if(!S.students.length){ toast("학생이 없습니다."); return; }
  const ok = await confirmBox("전체 문장 생성", S.students.length+"명의 "+n+"학기 문장을 차례로 만듭니다.\n이미 적어 둔 내용은 새 문장으로 덮어씁니다.\n시간이 걸릴 수 있습니다.");
  if(!ok) return;

  genRunning = true; genAbort = new AbortController();
  const wrap = $("#progWrap"), bar = $("#progBar"), txt = $("#progTxt"), stop = $("#progStop");
  wrap.classList.remove("hidden");
  stop.onclick = ()=>{ genAbort.abort(); };
  let done=0, fail=0;
  for(let i=0;i<S.students.length;i++){
    if(genAbort.signal.aborted) break;
    txt.textContent = S.students[i].no+"번 작성 중… ("+(i+1)+"/"+S.students.length+")";
    bar.style.width = Math.round(i/S.students.length*100)+"%";
    const r = await generateOne(i, n, false);
    if(r) done++; else fail++;
    if(genAbort.signal.aborted) break;
    await new Promise(r2=>setTimeout(r2, 350));
  }
  bar.style.width="100%";
  genRunning=false;
  const aborted = genAbort.signal.aborted;
  genAbort=null;
  save(true);
  render();
  toast(aborted? ("중지했습니다. "+done+"명 완료.") : (done+"명 완료"+(fail?(" · "+fail+"명 실패"):"")), 3200);
}

function semLabel(n){ return n+"학기"; }
function tableFor(n){
  const cols = ["번호","행동특성 및 종합의견"].concat(S.subjects.map(s=>"학기말 · "+s))
    .concat(["자율활동","동아리활동","진로활동","봉사활동"]);
  const rows = S.students.map(stu=>{
    const sm = sem(stu, n);
    return [String(stu.no), sm.out.behavior||""]
      .concat(S.subjects.map(sj=> sm.out.term[sj]||""))
      .concat([sm.out.auto||"", sm.out.club||"", sm.out.career||"", sm.out.service||""]);
  });
  return {cols:cols, rows:rows};
}
function longRowsFor(n){
  const out=[];
  S.students.forEach(stu=>{
    const sm = sem(stu, n);
    const items=[["행동특성 및 종합의견", sm.out.behavior||""]];
    S.subjects.forEach(sj=> items.push(["학기말 종합의견 · "+sj, sm.out.term[sj]||""]));
    items.push(["창의적 체험활동 · 자율활동", sm.out.auto||""]);
    items.push(["창의적 체험활동 · 동아리활동", sm.out.club||""]);
    items.push(["창의적 체험활동 · 진로활동", sm.out.career||""]);
    items.push(["창의적 체험활동 · 봉사활동", sm.out.service||""]);
    items.forEach(([k,v])=> out.push([String(stu.no), k, v]));
  });
  return out;
}

function openDownload(){
  openModal("표로 내려받기", (b, close)=>{
    b.append(el("div",{class:"sub-title"},"내려받을 학기"));
    const selSem = el("select",{style:"min-width:150px"});
    [["cur","지금 보는 "+semLabel(SEM)],["1","1학기"],["2","2학기"],["all","1·2학기 모두"]]
      .forEach(([v,t])=>selSem.append(el("option",{value:v},t)));
    b.append(el("div",{class:"fbox"}, el("div",{class:"f"}, el("label",null,"학기"), selSem)));

    b.append(el("div",{class:"sub-title",style:"margin-top:16px"},"파일 형식"));
    const box = el("div",{style:"display:flex;flex-direction:column;gap:8px"});
    box.append(fileRow("엑셀 파일 (.xlsx)","학기별 시트로 나누어 표를 만듭니다. 번호가 행, 항목이 열입니다.",
      ()=>doExcel(selSem.value, close)));
    box.append(fileRow("한글 파일 (.hwpx)","번호 · 구분 · 내용 세 칸짜리 표로 만듭니다. 한글에서 바로 열립니다.",
      ()=>doHwpx(selSem.value, close)));
    box.append(fileRow("한글용 표 (.html)","hwpx가 열리지 않을 때 쓰세요. 한글에서 [불러오기]로 열면 표가 그대로 들어옵니다.",
      ()=>doHtml(selSem.value, close)));
    b.append(box);
    b.append(el("div",{class:"hint"},"* 내려받기를 누르면 저장 여부를 한 번 더 묻습니다."));
  },{width:"620px"});
}
function fileRow(title, desc, fn){
  const r = el("div",{style:"display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:11px;background:var(--panel-2)"});
  r.append(el("div",{style:"flex:1"}, el("div",{style:"font-weight:700"},title), el("div",{class:"muted",style:"font-size:12px"},desc)));
  r.append(el("button",{class:"btn pri",onClick:fn},"내려받기"));
  return r;
}
function semsFrom(v){ return v==="all"? [1,2] : v==="cur"? [SEM] : [parseInt(v,10)]; }
function baseName(){
  return S.meta.year+"_"+S.meta.school+"_"+S.meta.grade+"학년"+S.meta.cls+"반_생활기록부초안";
}
async function saveFile(filename, data){
  if(!DL){ await capInit(); }
  if(!DL){ toast("이 화면에서는 파일 내려받기를 쓸 수 없습니다.", 3200); return; }
  try{
    await DL.save({filename:filename, data:data});
    toast("저장했습니다.");
  }catch(e){
    if(e && e.code==="declined") return;
    if(e && e.code==="rejected_extension"){
      const alt = filename.replace(/\.hwpx$/i, ".hwpx.zip");
      if(alt!==filename){
        try{
          await DL.save({filename:alt, data:data});
          toast("‘.zip’을 지우고 파일 이름을 …hwpx로 바꾸면 한글에서 열립니다.", 5200);
          return;
        }catch(e2){ if(e2 && e2.code==="declined") return; }
      }
    }
    toast("저장하지 못했습니다. 다른 형식으로 시도해 주세요.", 3200);
  }
}

/* --- 엑셀 --- */
function doExcel(v, close){
  try{
    const wb = XLSX.utils.book_new();
    semsFrom(v).forEach(n=>{
      const t = tableFor(n);
      const aoa = [t.cols].concat(t.rows);
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = t.cols.map((c,i)=> i===0? {wch:6} : {wch:46});
      XLSX.utils.book_append_sheet(wb, ws, semLabel(n));
    });
    const out = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    close();
    saveFile(baseName()+".xlsx", out);
  }catch(e){ toast("엑셀 파일을 만들지 못했습니다."); }
}

/* --- 한글용 HTML --- */
function doHtml(v, close){
  let h = '<html><head><meta charset="utf-8"><title>'+esc(baseName())+'</title></head><body>';
  semsFrom(v).forEach(n=>{
    h += '<h2>'+esc(S.meta.year+"학년도 "+S.meta.school+" "+S.meta.grade+"학년 "+S.meta.cls+"반 · "+semLabel(n))+'</h2>';
    h += '<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%">';
    h += '<tr><th style="width:8%">번호</th><th style="width:22%">구분</th><th>내용</th></tr>';
    longRowsFor(n).forEach(r=>{
      h += '<tr><td align="center">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2]).replace(/\n/g,"<br>")+'</td></tr>';
    });
    h += '</table><br>';
  });
  h += '</body></html>';
  close();
  saveFile(baseName()+".html", h);
}

/* --- HWPX --- */
function xe(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/\r/g,""); }
const HWPX_NS = 'xmlns:ha="http://www.hancom.co.kr/hwpml/2011/app" xmlns:hp="http://www.hancom.co.kr/hwpml/2011/paragraph" xmlns:hp10="http://www.hancom.co.kr/hwpml/2016/paragraph" xmlns:hs="http://www.hancom.co.kr/hwpml/2011/section" xmlns:hc="http://www.hancom.co.kr/hwpml/2011/core" xmlns:hh="http://www.hancom.co.kr/hwpml/2011/head" xmlns:hhs="http://www.hancom.co.kr/hwpml/2011/history" xmlns:hm="http://www.hancom.co.kr/hwpml/2011/master-page" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:ooxmlchart="http://www.hancom.co.kr/schema/2016/ooxmlchart" xmlns:hwpunitchar="http://www.hancom.co.kr/schema/2016/HwpUnitChar" xmlns:epub="http://www.idpf.org/2007/ops" xmlns:config="urn:oasis:names:tc:opendocument:xmlns:config:1.0"';

function hwpxHeader(){
  const langs=["HANGUL","LATIN","HANJA","JAPANESE","OTHER","SYMBOL","USER"];
  let ff = '<hh:fontfaces itemCnt="'+langs.length+'">';
  langs.forEach(l=>{
    ff += '<hh:fontface lang="'+l+'" fontCnt="2">'
       +  '<hh:font id="0" face="함초롬바탕" type="TTF" isEmbedded="0"><hh:typeInfo familyType="FCAT_MYUNGJO" weight="6" proportion="4" contrast="0" strokeVariation="1" armStyle="1" letterform="1" midline="1" xHeight="1"/></hh:font>'
       +  '<hh:font id="1" face="맑은 고딕" type="TTF" isEmbedded="0"><hh:typeInfo familyType="FCAT_GOTHIC" weight="6" proportion="4" contrast="0" strokeVariation="1" armStyle="1" letterform="1" midline="1" xHeight="1"/></hh:font>'
       +  '</hh:fontface>';
  });
  ff += '</hh:fontfaces>';

  function bf(id, on){
    const t = on? 'type="SOLID" width="0.12 mm" color="#000000"' : 'type="NONE" width="0.1 mm" color="#000000"';
    return '<hh:borderFill id="'+id+'" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0">'
      + '<hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/>'
      + '<hh:leftBorder '+t+'/><hh:rightBorder '+t+'/><hh:topBorder '+t+'/><hh:bottomBorder '+t+'/>'
      + '<hh:diagonal type="NONE" width="0.1 mm" color="#000000"/></hh:borderFill>';
  }
  function bfFill(id){
    return '<hh:borderFill id="'+id+'" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0">'
      + '<hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/>'
      + '<hh:leftBorder type="SOLID" width="0.12 mm" color="#000000"/><hh:rightBorder type="SOLID" width="0.12 mm" color="#000000"/>'
      + '<hh:topBorder type="SOLID" width="0.12 mm" color="#000000"/><hh:bottomBorder type="SOLID" width="0.12 mm" color="#000000"/>'
      + '<hh:diagonal type="NONE" width="0.1 mm" color="#000000"/>'
      + '<hc:fillBrush><hc:winBrush faceColor="#EEEEEE" hatchColor="#999999" alpha="0"/></hc:fillBrush></hh:borderFill>';
  }
  const borders = '<hh:borderFills itemCnt="3">'+bf(1,false)+bf(2,true)+bfFill(3)+'</hh:borderFills>';

  function charPr(id, size, bold, fontId){
    return '<hh:charPr id="'+id+'" height="'+size+'" textColor="#000000" shadeColor="none" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="1">'
      + '<hh:fontRef hangul="'+fontId+'" latin="'+fontId+'" hanja="'+fontId+'" japanese="'+fontId+'" other="'+fontId+'" symbol="'+fontId+'" user="'+fontId+'"/>'
      + '<hh:ratio hangul="100" latin="100" hanja="100" japanese="100" other="100" symbol="100" user="100"/>'
      + '<hh:spacing hangul="0" latin="0" hanja="0" japanese="0" other="0" symbol="0" user="0"/>'
      + '<hh:relSz hangul="100" latin="100" hanja="100" japanese="100" other="100" symbol="100" user="100"/>'
      + '<hh:offset hangul="0" latin="0" hanja="0" japanese="0" other="0" symbol="0" user="0"/>'
      + (bold? '<hh:bold/>':'')
      + '</hh:charPr>';
  }
  const chars = '<hh:charProperties itemCnt="4">'+charPr(0,1000,false,0)+charPr(1,900,false,1)+charPr(2,900,true,1)+charPr(3,1400,true,1)+'</hh:charProperties>';

  function paraPr(id, align){
    return '<hh:paraPr id="'+id+'" tabPrIDRef="0" condense="0" fontLineHeight="0" snapToGrid="1" suppressLineNumbers="0" checked="0">'
      + '<hh:align horizontal="'+align+'" vertical="BASELINE"/>'
      + '<hh:heading type="NONE" idRef="0" level="0"/>'
      + '<hh:breakSetting breakLatinWord="KEEP_WORD" breakNonLatinWord="KEEP_WORD" widowOrphan="0" keepWithNext="0" keepLines="0" pageBreakBefore="0" lineWrap="BREAK"/>'
      + '<hh:autoSpacing eAsianEng="0" eAsianNum="0"/>'

      + '<hh:lineSpacing type="PERCENT" value="150" unit="HWPUNIT"/>'
      + '<hh:border borderFillIDRef="1" offsetLeft="0" offsetRight="0" offsetTop="0" offsetBottom="0" connect="0" ignoreMargin="0"/>'
      + '</hh:paraPr>';
  }
  const paras = '<hh:paraProperties itemCnt="3">'+paraPr(0,"JUSTIFY")+paraPr(1,"CENTER")+paraPr(2,"LEFT")+'</hh:paraProperties>';

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'

   + '<hh:beginNum page="1" footnote="1" endnote="1" pic="1" tbl="1" equation="1"/>'
   + '<hh:refList>'
   + ff + borders + chars
   + '<hh:tabProperties itemCnt="1"><hh:tabPr id="0" autoTabLeft="0" autoTabRight="0"/></hh:tabProperties>'
   + '<hh:numberings itemCnt="1"><hh:numbering id="1" start="0">'
   + [1,2,3,4,5,6,7].map(l=>'<hh:paraHead start="1" level="'+l+'" align="LEFT" useInstWidth="1" autoIndent="1" widthAdjust="0" textOffsetType="PERCENT" textOffset="50" numFormat="DIGIT" charPrIDRef="4294967295" checkable="0">^'+l+'.</hh:paraHead>').join('')
   + '</hh:numbering></hh:numberings>'
   + paras
   + '<hh:styles itemCnt="1"><hh:style id="0" type="PARA" name="바탕글" engName="Normal" paraPrIDRef="0" charPrIDRef="0" nextStyleIDRef="0" langID="1042" lockForm="0"/></hh:styles>'
   + '</hh:refList>'
   + '<hh:compatibleDocument targetProgram="HWP201X"><hh:layoutCompatibility/></hh:compatibleDocument>'

}

function hp(text, paraPr, charPr){
  return '<hp:p id="0" paraPrIDRef="'+paraPr+'" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0">'
    + '<hp:run charPrIDRef="'+charPr+'"><hp:t>'+xe(text)+'</hp:t></hp:run></hp:p>';
}
function hpCellParas(text, paraPr, charPr){
  const lines = String(text==null?"":text).split("\n");
  return lines.map(l=>hp(l, paraPr, charPr)).join("");
}
function hwpxTable(rows, widths, tblId){
  const colCnt = widths.length, rowCnt = rows.length;
  let x = '<hp:tbl id="'+tblId+'" zOrder="'+tblId+'" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="1" rowCnt="'+rowCnt+'" colCnt="'+colCnt+'" cellSpacing="0" borderFillIDRef="2" noAdjust="0">'
    + '<hp:sz width="'+widths.reduce((a,b)=>a+b,0)+'" widthRelTo="ABSOLUTE" height="'+(rowCnt*1200)+'" heightRelTo="ABSOLUTE" protect="0"/>'
    + '<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>'
    + '<hp:outMargin left="0" right="0" top="0" bottom="0"/>'
    + '<hp:inMargin left="141" right="141" top="141" bottom="141"/>';
  rows.forEach((row, r)=>{
    x += '<hp:tr>';
    row.forEach((cell, c)=>{
      const head = (r===0);
      x += '<hp:tc name="" header="'+(head?1:0)+'" hasMargin="0" protect="0" editable="0" dirty="0" borderFillIDRef="'+(head?3:2)+'">'
        + '<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">'
        + hpCellParas(cell, (head||c===0)?1:2, head?2:1)
        + '</hp:subList>'
        + '<hp:cellAddr colAddr="'+c+'" rowAddr="'+r+'"/>'
        + '<hp:cellSpan colSpan="1" rowSpan="1"/>'
        + '<hp:cellSz width="'+widths[c]+'" height="1200"/>'
        + '<hp:cellMargin left="141" right="141" top="141" bottom="141"/>'
        + '</hp:tc>';
    });
    x += '</hp:tr>';
  });
  x += '</hp:tbl>';
  return '<hp:p id="0" paraPrIDRef="0" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="1">'+x+'</hp:run></hp:p>';
}
function hwpxSection(v){
  const secPr = '<hp:secPr id="" textDirection="HORIZONTAL" spaceColumns="1134" tabStop="8000" tabStopVal="4000" tabStopUnit="HWPUNIT" outlineShapeIDRef="1" memoShapeIDRef="0" textVerticalWidthHead="0" masterPageCnt="0">'
   + '<hp:grid lineGrid="0" charGrid="0" wonggojiFormat="0" strtnum="0"/>'
   + '<hp:startNum pageStartsOn="BOTH" page="0" pic="0" tbl="0" equation="0"/>'
   + '<hp:visibility hideFirstHeader="0" hideFirstFooter="0" hideFirstMasterPage="0" border="SHOW_ALL" fill="SHOW_ALL" hideFirstPageNum="0" hideFirstEmptyLine="0" showLineNumber="0"/>'
   + '<hp:lineNumberShape restartType="0" countBy="0" distance="0" startNumber="0"/>'
   + '<hp:pagePr landscape="WIDELY" width="59528" height="84188" gutterType="LEFT_ONLY">'
   + '<hp:margin header="4252" footer="4252" gutter="0" left="8504" right="8504" top="5668" bottom="4252"/></hp:pagePr>'
   + '<hp:footNotePr><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/><hp:noteLine length="-1" type="SOLID" width="0.12 mm" color="#000000"/><hp:noteSpacing betweenNotes="850" belowLine="567" aboveLine="850"/><hp:numbering type="CONTINUOUS" newNum="1"/><hp:placement place="EACH_COLUMN" beneathText="0"/></hp:footNotePr>'
   + '<hp:endNotePr><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar=")" supscript="0"/><hp:noteLine length="14692344" type="SOLID" width="0.12 mm" color="#000000"/><hp:noteSpacing betweenNotes="0" belowLine="567" aboveLine="850"/><hp:numbering type="CONTINUOUS" newNum="1"/><hp:placement place="END_OF_DOCUMENT" beneathText="0"/></hp:endNotePr>'
   + ['BOTH','EVEN','ODD'].map(t=>'<hp:pageBorderFill type="'+t+'" borderFillIDRef="1" textBorder="PAPER" headerInside="0" footerInside="0" fillArea="PAPER"><hp:offset left="1417" right="1417" top="1417" bottom="1417"/></hp:pageBorderFill>').join('')
   + '</hp:secPr>'
   + '<hp:ctrl><hp:colPr id="" type="NEWSPAPER" layout="LEFT" colCount="1" sameSz="1" sameGap="0"/></hp:ctrl>';

  let body = '<hp:p id="0" paraPrIDRef="1" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="3">'+secPr+'<hp:t>'
    + xe(S.meta.year+"학년도 "+S.meta.school+" "+S.meta.grade+"학년 "+S.meta.cls+"반 학교생활기록부 초안")+'</hp:t></hp:run></hp:p>';
  let tid = 1;
  semsFrom(v).forEach(n=>{
    body += hp("", 0, 1);
    body += hp("■ "+semLabel(n), 2, 2);
    const rows = [["번호","구분","내용"]].concat(longRowsFor(n));
    body += hwpxTable(rows, [3600, 9400, 29520], tid++);
  });
  body += hp("", 0, 1);
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<hs:sec '+HWPX_NS+'>'+body+'</hs:sec>';
}

async function doHwpx(v, close){
  if(typeof JSZip==="undefined"){ toast("한글 파일 모듈을 불러오지 못했습니다. 엑셀이나 html을 써 주세요.",3600); return; }
  try{
    const zip = new JSZip();
    zip.file("mimetype","application/hwp+zip",{compression:"STORE"});
    zip.file("version.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<hv:HCFVersion xmlns:hv="http://www.hancom.co.kr/hwpml/2011/version" tagetApplication="WORDPROCESSOR" major="5" minor="1" micro="1" buildNumber="0" os="10" xmlVersion="1.4" application="Hancom Office Hwp" appVersion="10.0.0.0"/>');
    zip.folder("META-INF").file("container.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<ocf:container xmlns:ocf="urn:oasis:names:tc:opendocument:xmlns:container" xmlns:hpf="http://www.hancom.co.kr/schema/2011/hpf"><ocf:rootfiles><ocf:rootfile full-path="Contents/content.hpf" media-type="application/hwpml-package+xml"/></ocf:rootfiles></ocf:container>');
    zip.folder("META-INF").file("manifest.xml",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<odf:manifest xmlns:odf="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" version="1.2"><odf:file-entry odf:full-path="/" odf:media-type="application/hwp+zip"/><odf:file-entry odf:full-path="Contents/header.xml" odf:media-type="application/xml"/><odf:file-entry odf:full-path="Contents/section0.xml" odf:media-type="application/xml"/></odf:manifest>');
    const title = xe(baseName());
    zip.folder("Contents").file("content.hpf",
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<opf:package xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:ha="http://www.hancom.co.kr/hwpml/2011/app" xmlns:dc="http://purl.org/dc/elements/1.1/" version="" unique-identifier="" id="">'
      + '<opf:metadata><opf:title>'+title+'</opf:title><opf:language>ko</opf:language><opf:meta name="creator" content=""/></opf:metadata>'
      + '<opf:manifest><opf:item id="header" href="Contents/header.xml" media-type="application/xml" isEmbeded="0"/><opf:item id="section0" href="Contents/section0.xml" media-type="application/xml" isEmbeded="0"/></opf:manifest>'
      + '<opf:spine><opf:itemref idref="header" linear="yes"/><opf:itemref idref="section0" linear="yes"/></opf:spine></opf:package>');
    zip.folder("Contents").file("header.xml", hwpxHeader());
    zip.folder("Contents").file("section0.xml", hwpxSection(v));
    zip.file("settings.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<ha:HWPApplicationSetting xmlns:ha="http://www.hancom.co.kr/hwpml/2011/app" xmlns:config="urn:oasis:names:tc:opendocument:xmlns:config:1.0"><ha:CaretPosition listIDRef="0" paraIDRef="0" pos="0"/></ha:HWPApplicationSetting>');
    const blob = await zip.generateAsync({type:"blob", mimeType:"application/hwp+zip"});
    close();
    await saveFile(baseName()+".hwpx", blob);
  }catch(e){ toast("한글 파일을 만들지 못했습니다. 엑셀이나 html을 써 주세요.",3600); }
}

/* ============================================================
   14. 기능 연결 · 시작
   ============================================================ */
function capInit(){
  if(capPromise) return capPromise;
  capPromise = capInitRun();
  return capPromise;
}
async function capInitRun(){
  capReady = true;
  if(typeof window.claude === "undefined" || !window.claude || typeof window.claude.use!=="function"){
    capState = "nosample"; refreshCapWarn(); return;
  }
  const get = (n)=> window.claude.use(n).catch(()=>null);
  const [db, sp, dl, us] = await Promise.all([get("db"), get("sample"), get("downloads"), get("user")]);
  DB = db || null; SAMPLE = sp || null; DL = dl || null;
  if(us){ try{ UID = await us.id(); }catch(e){ UID = null; } }
  if(DB && UID && S && !S.demo){
    const remote = await dbLoad(S.key);
    if(remote && (remote._ts||0) > (S._ts||0) + 2000){
      closeAllModals();
      S = ensureShape(clone(remote)); lsSave(S); render();
      toast("저장해 둔 최신 내용을 불러왔습니다.");
    } else { dbSaveSoon(S); }
    watchRemote();
  }
  capState = SAMPLE ? "ready" : "nosample";
  if(capState==="nosample" && S && screen==="main") render();   // 단추까지 다시 그려 잠근다
  else refreshCapWarn();
  if(DB && S && screen==="main") refreshGradeBanner();
}

window.addEventListener("beforeunload", ()=>{ if(S) lsSave(S); });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && S) lsSave(S); });

render();
capInit();
